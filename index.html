라 양 그림 위에 자유롭게 붙이며 꾸며보았답니다.\n윤이는 플레이콘 보다는 양말목이 마음에 들었는지 양말목만 붙여주었어요\n\n미술놀이 뒤에는 교실에 붙여놓은 무지개 공작새와 색깔 발자국에도 관심을 보였어요.\n발자국을 따라 걸어보기도 하고, 신발을 신고 발자국의 색깔과 맞춰보며 놀이하는 모습도 보였답니다.\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 농도가 좋아 당산공원으로 산책을 다녀왔어요.\n공원에 열린 장터를 둘러보며 주변을 살펴보고, 공터에서는 자연물을 만져보며 시원한 바람을 느끼고 자유롭게 놀이했답니다.\n신나게 놀이하고 돌아와 점심 김자반에 맛있게 먹고 미트볼은 맛보았답니다\n\n윤이 낮잠 전까지는 평소보다 기운은 없었지만 다행히 열은 없었어요.\n낮잠 후에도 지속적으로 체온 확인하고 발열 시 해열제 투약하겠습니다\n\n내일은 물감 놀이를 진행할 예정입니다. 물감이 묻어도 괜찮은 옷을 입혀 등원해 주시기 바랍니다.\n물티슈 2팩에 이름을 기입하여 보내주시기 바랍니다.", "photos": [{"src": "media/1450851550/photo-001.jpg", "thumbnail": "media/1450851550/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1450851550/photo-002.jpg", "thumbnail": "media/1450851550/thumb-photo-002.jpg", "width": 1920, "height": 1080}], "videos": [], "sourceIds": ["1450851550"], "sourceCount": 1}, {"id": "1451507830", "date": "2026-09-15", "className": "채송화반", "content": "윤이가 아직 등원하지 않아서요 \n병원갔다 오는 걸까요??\n채송화반은 지금 1층 놀이터에 있습니다~", "photos": [], "videos": [], "sourceIds": ["1451507830"], "sourceCount": 1}, {"id": "1452250606", "date": "2026-09-16", "className": "채송화반", "content": "선생님 안녕하세요.\n윤이 오늘 병원 다녀와 알림장 남깁니다.\n\n원래 다니던 곳이 휴진이라 다른 병원에 다녀오게 되었는데요.\n감기약 처방받으며 눈에 대해서도 여쭤봤는데 현재 아무런 증상이 없어 진단이 어렵고, 증상이 없으면 전염력이 없어 등원에 문제없을 것 같다고 하셨습니다. (오늘 아침에는 눈곱도 없었어요)\n\n그런데 확인서 요청드리니 다소 애매하게 적어주신 것 같아서... 이 확인서로 내일 등원해도 될지 문의드립니다🥹", "photos": [{"src": "media/1452250606/photo-001.jpg", "thumbnail": "media/1452250606/thumb-photo-001.jpg", "width": 1920, "height": 1440}], "videos": [], "sourceIds": ["1452250606"], "sourceCount": 1}, {"id": "1453003792", "date": "2026-09-17", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈만 먹고 놀이를 시작해 보았어요\n\n사과가 쿵 그림책을 함께 보며 빨간색과 사과에 관심을 보이는 아이들과 오늘은 레드데이 놀이를 해보았어요.\n빨간색 습자지를 손으로 자유롭게 찢어보고 하늘로 날려보며 천천히 내려오는 모습을 살펴보았답니다.\n바닥에 누워 친구들이 덮어주는 빨간색 습자지를 이불처럼 덮어보기도 하고, 습자지를 동그랗게 뭉쳐 큰 사과를 만들어보기도 했어요.\n교실 벽면에 붙인 빨간색 수술 커튼사이를 왔다 갔다 지나가며 몸을 움직여보았어요.\n빨간색 수술을 손으로 만져보기도 하고, 사이를 지나며 흔들리는 모습을 살펴보며 놀이했답니다\n하트 핀을 착용하고 예쁘게 포토존에서 사진도 찍어보고, 짝짝이를 흔들며 소리를 들어보며 놀이해 보았답니다.\n윤이는 빨간 종이컵을 사용하여 높이 높이 탑을 쌓아보기도 하였답니다\n\n레드데이 놀이 신나게 한 뒤에는 미세먼지 좋음으로 놀이터에도 다녀왔어요.\n미끄럼틀과 흔들 말을 타고 모래놀이를 하며 바깥에서 몸을 움직여보았어요.\n나무에서 떨어진 나뭇잎을 주워 살펴보며 가을을 느껴보았어요.\n\n점심은 잡채와 김치에 한 그릇 뚝딱 먹고 점심 식사 후 대변도 보았어요\n\n*오늘 활동사진은 앨범에서 확인해 주세요.\n*원내 독감이 유행하고 있어 마스크 착용을 부탁드리며, 여분 마스크 2개를 가방에 넣어 보내주세요.\n*두근두근 책 교환소 도서 수집 기간은 내일까지입니다.\n가정에서 사용하지 않는 동화책을 1권 이상을 내일까지 보내주시기 바랍니다.", "photos": [], "videos": [], "sourceIds": ["1453003792"], "sourceCount": 1}, {"id": "1453719859", "date": "2026-09-18", "className": "채송화반", "content": "윤이는 오늘 오전간식 마시는 요거트가맛있었는지 더 달라고 표현하는 아침이었어요\n(오늘 사과를 먹어보기로 한 날이라 요거트는더 먹지 않았는데 사과 껍질 때문인지 윤이는 조금 먹고 사과를 남겼답니다)\n\n간식을 먹은 뒤 오늘은 그물에 매달린 사과를 보며 관심을 보이고 사과를 따보려고 손을 뻗어보며 매달린 사과를 탐색해 보았어요.\n사과를 다 떼고 나면 친구들이 볼 수 있는 사과가 없으니 눈으로 보기로 약속하며 흔들흔들 흔들리는 사과를 탐색해 보았답니다\n\n볼풀공 사과를 탐색해 본 뒤에는「사과가 쿵」 그림책을 읽은 후 책 속 그림을 전지에 붙여준 것을 보고 “사과”라고 말해보기도 했답니다.\n사과 그림 위에 자유롭게 끼적여보고, 사과와 같은 동그란 모양의 스티커를 골라 붙이며 놀이를 이어갔어요.\n\n그림 그리기 뒤에는 친구들과 양말목 줄다리기도 해보고 선생님과 함께 사과를 직접 살펴보고 맛도 보았어요.\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 좋음으로 놀이터에 나가 친구들과 함께 달리며 신나게 몸을 움직여보았어요.\n신체 놀이 즐겁게 한 뒤에는 교실에서 한 놀이를 이어 「사과가 쿵」의 마지막 장면에서 사과가 우산이 되었던 모습을 떠올려 우산에 분무기로 물을 뿌리고 빨간색 셀로판지를 붙여보았어요.\n책에서 만난 사과에 대한 경험이 다양한 놀이와 표현으로 자연스럽게 이어지는 시간이었답니다\n\n신나게 놀이하고 점심 돈가스와 밥 두 번씩 든든히 먹는 윤이었어요\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다", "photos": [{"src": "media/1453719859/photo-001.jpg", "thumbnail": "media/1453719859/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1453719859/photo-002.jpg", "thumbnail": "media/1453719859/thumb-photo-002.jpg", "width": 1920, "height": 1440}], "videos": [], "sourceIds": ["1453719859"], "sourceCount": 1}, {"id": "1454636241", "date": "2026-09-21", "className": "채송화반", "content": "주말 잘 보내셨나요?\n\n윤이는 오늘 오전간식 마들렌 조금 먹고 놀이를 시작해 보았어요\n\n오늘은 다가오는 추석을 맞아 다양한 전통놀이와 추석 관련 놀이를 경험해 보았어요\n가을 풍경 앞에서 떡방아를 찧어보기도 하고, 비닐 병풍에 있는 그림을 살펴보며 마카펜으로 자유롭게 끼적이고 색칠해 보았답니다.\n벽돌블록으로 비석치기놀이도 해보았어요.\n비석(벽돌 블록)을 세워놓고 블록으로 쳐보는 방법을 알려주자 손으로 직접 처 보기도 하고, 블록을 높이 쌓아보며 자신만의 방법으로 놀이를 즐겼어요.\n윤이는 여러 가지 놀이들 중에서도 떡방아 놀이가 재미있었는지 긴 \n\n오늘은 몬테소리 도형 막대 퍼즐 맞추기에 도전해 보았어요.\n도형의 모양뿐만 아니라 방향과 각도까지 세심하게 살펴 구멍에 맞춰 넣어야 하는 퍼즐이라 조금 더 높은 집중력과 눈과 손의 협응이 필요한 놀이였답니다.\n도형을 이리저리 돌려보며 알맞은 자리를 찾아가는 과정을 통해 공간을 탐색하고 문제를 해결하는 경험도 해보았어요.\n윤이는 처음에 삼각형까지는 어려움 없이 맞추고 사각형 부분에서 조금 어려움을 보였는데 모양을 돌려서 넣다 보면 맞는 곳이 나온다고 알려주자 금방 방법을 터득해 놀이해보았답니다.\n\n막대 퍼즐 놀이 뒤에는 어제 자석 보드에 네모 모양을 그려보며 즐겁게 놀이하던 친구들의 흥미를 반영하여 점선을 따라 도형 그리기 놀이를 해보았어요.\n점선을 따라 사인펜으로 선을 그어보며 도형의 모양을 표현해 보고, 다양한 모양의 도장을 콩콩 찍어 알록달록하게 꾸며보기도 하였답니다.\n윤이는 모든 도형을 따라 그린 뒤 네모 모양을 색칠해보기도 하고 다양한 모양의 도장을 찍어보며 놀이하였어요\n\n교실에서 즐겁게 놀이한 뒤에는 처음으로 양평 유수지에 다녀왔어요.\n산책길에 만난 포클레인과 트럭 등 다양한 중장비를 발견하며 반가워하던 친구들이었답니다.\n공원에 도착해서는 알록달록 날아다니는 나비와 곳곳에 피어난 꽃, 주변의 다양한 자연물을 관찰하며 가을의 풍경을 느껴보았어요.\n\n점심 채소계란볶음에 맛있게 한 그릇 뚝딱 먹는 윤이었어요~\n윤이와 건강하고 즐거운 연휴 보내시고 화요일에 뵙겠습니다~\n\n* 여벌옷을 보내드립니다. 확인하신 후 가을용 여벌옷으로 교체하여 보내주세요.", "photos": [{"src": "media/1459990517/photo-001.jpg", "thumbnail": "media/1459990517/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1459990517/photo-002.jpg", "thumbnail": "media/1459990517/thumb-photo-002.jpg", "width": 1920, "height": 3632}], "videos": [], "sourceIds": ["1459990517"], "sourceCount": 1}, {"id": "1460951382", "date": "2026-10-06", "className": "채송화반", "content": "연휴 잘 보내셨나요?\n오늘은 지난주부터 낙엽에 관심을 보이며 가을의 변화를 즐겁게 탐색하고 있는 채송화반의 흥미를 반영하여 나뭇잎 가방 고리 꾸미기 놀이를 해보았어요.\n여러 가지 모양의 나뭇잎 모양 틀을 살펴보며 마음에 드는 모양을 선택해 보고, 다양한 색의 사인펜으로 나뭇잎을 알록달록하게 색칠해 보았답니다.\n색을 칠하는 과정에서 나뭇잎의 모양과 색을 자연스럽게 탐색해 보고, 자신만의 방법으로 꾸며보며 소근육을 조절하는 경험도 해볼 수 있었어요. 정성스럽게 꾸민 나뭇잎은 가방 고리로 완성하여 가방에 달아보며 완성된 작품을 생활 속에서 활용해 보았답니다.\n가을의 자연물을 떠올리며 계절의 변화를 느껴볼 수 있는 시간이었어요.\n윤이는 알록달록하게 나뭇잎을 만들어볼 거라고 이야기하더니 정말 다양한 색을 사용해 꼼꼼히 색을 칠해주었답니다\n\n교실에서 즐겁게 놀이한 뒤에는 1층 놀이터로 나가 바깥놀이도 즐겨보았어요.\n새 모래가 가득 채워진 모래놀이터에서 부드러운 모래를 손으로 만지고 담아보며 자유롭게 모래놀이를 즐겨보았답니다.\n또 바닥에 떨어진 알록달록한 나뭇잎을 발견하고 미끄럼틀 위로 가져가 함께 미끄러뜨려보며 나뭇잎이 움직이는 모습을 살펴보기도 했어요.\n선선한 가을바람을 느끼며 자연과 함께 몸을 움직이며 놀이해 보는 시간이었답니다.\n\n점심은 오리고기 추가배식받아 맛있게 한 그릇 뚝딱 먹는 윤이었어요", "photos": [{"src": "media/1460951382/photo-001.jpg", "thumbnail": "media/1460951382/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1460951382/photo-002.jpg", "thumbnail": "media/1460951382/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1460951382"], "sourceCount": 1}, {"id": "1461685237", "date": "2026-10-07", "className": "채송화반", "content": "윤이는 오늘 오전간식 온두부 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 어제 놀이터에서 나뭇잎을 미끄럼틀에 태워주며 놀이했던 경험을 이어 교실에서도 나뭇잎 미끄럼틀 놀이를 해보았어요.\n비닐 미끄럼틀 위에 알록달록한 조형 나뭇잎을 올려놓고 하나씩 슝~ 미끄러져 내려오는 모습을 살펴보며 나뭇잎의 움직임과 속도를 자연스럽게 탐색해 보았답니다.\n나뭇잎을 여러 장 함께 올려보기도 하고, 직접 손으로 밀어보며 다양한 방법으로 미끄럼틀 놀이를 즐겨보았어요.\n신나게 나뭇잎 미끄럼틀 놀이를 즐긴 뒤에는 바구니 속에 있는 청소 도구를 발견하고 빗자루를 이용해 바닥에 떨어진 나뭇잎을 쓱쓱 쓸어보았어요.\n작은 나뭇잎들을 한 곳으로 모아 바구니에 담아보며 눈과 손의 협응력과 소근육을 조절하는 경험도 자연스럽게 해 볼 수 있었답니다.\n열심히 모은 나뭇잎은 이번에는 냄비 속으로 쏙 들어가 맛있는 가을 음식으로 변신하기도 하며 요리 놀이로도 즐겁게 확장해 보았어요.\n\n자유놀이를 충분히 즐긴 후에는 소방대피 훈련에도 참여하여 안전하게 대피하는 방법을 경험해 보았어요.\n훈련을 마친 뒤에는 놀이터로 나가 교실에서 즐겼던 놀이를 실제 자연물과 연결해 보았답니다.\n바닥에 떨어진 다양한 나뭇잎을 직접 살펴보고 모아보며 교실에서 경험했던 나뭇잎 미끄럼틀과 요리 놀이를 자연스럽게 이어가 보았답니다.\n오랜만에 비눗방울 놀이까지 다양한 놀이를 즐기고 돌아왔어요\n\n윤이는 나뭇잎에 모래를 넣은 뒤 돌돌 말아 김밥을 만들어주었어요\n처음에는 나뭇잎이 잘 말리지 않아 모래가 빠져 어떻게 만들까 고민하더니 몇 번 시도하며 금방 맛있는 김밥을 만들어 대접해 주었답니다\n\n신나게 놀이하고 점심 짜장 소스 조금씩 찍어 맛있게 먹었답니다~", "photos": [{"src": "media/1461685237/photo-001.jpg", "thumbnail": "media/1461685237/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1461685237/photo-002.jpg", "thumbnail": "media/1461685237/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1461685237"], "sourceCount": 1}, {"id": "1462432363", "date": "2026-10-08", "className": "채송화반", "content": "윤이는 오늘 오전간식 두 접시 맛있게 먹고 하루를 시작해 보았어요\n\n오늘은 가을의 정취를 느껴보기 위해 당산공원으로 가을 나들이를 다녀왔어요.\n높고 푸르게 펼쳐진 가을 하늘을 올려다보며 계절의 변화를 느껴보고, 공원 바닥에 떨어진 솔방울과 나뭇가지, 돌멩이 등 주변에서 쉽게 만날 수 있는 다양한 자연물을 하나씩 발견하며 탐색해 보았답니다.\n자연물들은 채송화반에게 재미있는 놀잇감이 되어 이리저리 살펴보고 만져보며 자유롭게 놀이해 보았어요.\n보드라운 모래 위에서는 나뭇가지를 이용해 자유롭게 선을 그어보며 그림을 표현해보기도 하고, 나무를 살펴보다가 몸이 간지러운 나무를 발견하고는 나뭇가지를 이용해 열심히 긁어주며 자연과 교감하는 모습도 보였답니다.\n공원에서 재미있게 탐색한 자연물은 종이에 하나씩 붙여보며 ‘가을 수집하기’ 놀이로 이어가 보았어요.\n솔방울과 나뭇가지, 돌멩이 등을 가까이에서 살펴보고 내가 발견한 가을의 모습을 종이 위에 담아보며 가을을 더욱 가까이 느껴볼 수 있었답니다. 윤이는 돌멩이가 제일 마음에 드는지 돌멩이를 열심히 모아보며 놀이해 보았답니다\n\n자연물 탐색을 마친 뒤에는 친구들과 함께 나무뿌리를 따라 징검다리 놀이도 해보고, 넓은 공간을 신나게 달리며 몸을 움직여보았어요.\n충분히 뛰어놀고 난 뒤에는 준비한 뻥튀기도 함께 나누어 먹으며 선선한 가을바람 속에서 작은 가을 소풍의 즐거움도 느껴보았답니다.\n\n자연 속에서 가을을 만나고 주변에서 만나는 다양한 탈것까지 탐색하는 작은 가을 나들이를 보내고 돌아왔답니다.\n돌아오는 길 신이 나는지 아빠와 크레파스 노래도 불러주었어요\n\n한글날 연휴 동안 가족과 함께 행복하고 여유로운 시간 보내시고, 다음 주에 뵙겠습니다\n\n*평가제준비로 인하여 이불 이름표를 보내드립니다. 자세한 사항은 첨부해 드린 설명을 참고하시어 이름표를 달아 보내주세요\n(11월 중에 평가제가 이루어지오니 11월에 덮을 이불에 붙여주시면 됩니다)\n\n*10월 12일(월) ~ 13일(화)은 정수남 교사의 연차 휴가일 입니다. 채송화반 보육은 보조 인력이 투입될 예정이오니 참고해 주세요", "photos": [{"src": "media/1462432363/photo-001.jpg", "thumbnail": "media/1462432363/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1462432363/photo-002.jpg", "thumbnail": "media/1462432363/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1462432363"], "sourceCount": 1}, {"id": "1463369060", "date": "2026-10-12", "className": "채송화반", "content": "연휴 잘 보내셨어요?\n\n오전간식을 확인 후 윤이는 먹지 않겠다고 표현하여 먹지 않았고, 점심 식사시간에는 샐러드 제외하고 밥 두 그릇 먹었어요\n\n지난주 낙엽 청소놀이에 흥미를 보였던 경험을 이어 오늘은 긴 빗자루와 막대 밀대를 제공해 주었어요. 막대 밀대에 청소포를 끼워주자 이리저리 자유롭게 움직이며 청소하는 모습을 보였답니다. 쓱쓱 밀대를 움직이며 청소하는 놀이를 즐겼어요.\n\n다양한 낙엽 그림 위에 자유롭게 끼적이고 색칠해 보았어요. 알록달록한 단풍잎 스티커도 제공해 주었더니 낙엽 그림 위에 붙이며 가을 풍경을 예쁘게 꾸며주었답니다.\n\n오늘은 미세먼지 농도가 좋아 1층 놀이터에서 바깥놀이를 즐겼어요. 미끄럼틀과 모래놀이를 하고 흔들 말도 타며 신나게 놀이했답니다.\n놀이터에 떨어진 낙엽을 발견하고는 빗자루를 이용해 쓱쓱 쓸어보며 교실에서 경험했던 청소놀이를 바깥에서도 이어갔어요.\n\n윤이는 놀이터에 떨어진 나뭇잎을 봉지 안에 가득 담아보았어요. 나뭇잎을 모은 후 친구들에게 “나뭇잎 갖고 싶으면 나한테 말해!”라고 이야기하는 모습도 보였답니다. 자신이 모은 나뭇잎을 친구들과 나누고 싶어 하는 듯한 윤이의 모습이 무척 귀여웠어요.\n\n*오늘의 활동 사진은 앨범에서 확인해 주세요.", "photos": [], "videos": [], "sourceIds": ["1463369060"], "sourceCount": 1}, {"id": "1464090536", "date": "2026-10-13", "className": "채송화반", "content": "오전간식 먹었고 점심 식사시간에는 미역줄기와 고기 조금 먹었고, 밥을 더 먹겠다고 하여 두번 먹었답니다.\n\n어제 청소놀이에 이어 오늘도 막대 밀대와 빗자루를 이용해 청소놀이를 해보았어요. 네모난 공간을 만들어 제공해 주었더니 나뭇잎을 하나씩 모아보며 즐겁게 놀이했답니다.\n\n오늘은 은행잎 꽃꽂이 놀이도 해보았어요. 구멍에 은행잎을 하나씩 끼워 넣으며 나만의 예쁜 화분을 완성해 보았답니다. 은행잎을 손으로 잡고 구멍에 넣어보며 소근육을 조절하는 경험도 해보았어요.\n\n다가오는 작품 전시회를 준비하며 공작새 그림도 탐색해 보았어요. 알록달록한 공작새의 날개를 살펴보고 다양한 스티커를 하나씩 붙여 꾸며주었답니다. 윤이는 물방울 스티커를 붙이면서 \"이거 물방울이네\"라고 말하였고, 노란색 스티커를 떼어 노란색 날개를 보면서 \"이거 색깔 똑같네\"라고 말해보았어요.작은 보석스티커와 큰 보석스티커가있었는데 큰 보석스티커를 보며 \"이거 엄청크다\"라고 말하였어요.\n스티커로 날개를 아름답게 채워가며 작품을 완성해 가는 시간을 가졌어요.\n\n비가 내려 오늘은 공동놀이실에서 신체놀이를 즐겼어요. 미끄럼틀을 타고 자동차를 타며 신나게 움직였고, 관심 있는 책을 자유롭게 꺼내어 살펴보며 여유로운 시간도 보냈답니다.\n\n*오늘의 활동 사진은 앨범에서 확인해 주세요.", "photos": [], "videos": [], "sourceIds": ["1464090536"], "sourceCount": 1}, {"id": "1464818337", "date": "2026-10-14", "className": "채송화반", "content": "윤이는 오늘 오전간식 시리얼 조금 먹고 놀이를 시작해 보았어요\n\n다가오는 작품 전시회를 준비하며 오늘은 ‘색깔 사다리 몬드리안’ 활동을 해보았어요.\n윤이는 선생님이 새로운 재료를 준비하는 모습을 보고 놀이도 멈추고 다가가 친구들의 놀이를 관찰하며 윤이의 순서를 기다려주었답니다\n종이 위에 포일아트 홀로그램을 문질러 표현할 수 있도록 다양한 색을 탐색하고, 마음에 드는 색을 직접 골라 풀을 칠한 뒤 홀로그램을 문지르고 떼어내자 종이 위에 나타난 색을 신기하게 살펴보았어요.\n다양한 질감의 종이를 붙이며 나만의 작품을 완성해 보았답니다.\n\n미술놀이 뒤에는 미세먼지가 좋아 1층 놀이터에서도 신나게 놀이했어요.\n미끄럼틀을 타고 흔들 말을 타며 몸을 움직였답니다.\n바닥에 떨어진 나뭇잎도 모아 꼬치에 하나씩 끼워보았어요.\n색깔 애벌레를 살펴보며 원하는 색과 모양을 골라 나뭇잎 애벌레를 만들어 보았답니다.\n\n신나게 놀이하고 와서인지 점심 야채베이컨볶음밥 골라내는 야채 없이 밥 두 그릇 든든히 먹었어요~ (전에는 부추를 골라내었는데 오늘은 다 먹었답니다)\n\n*오늘 활동 사진은 앨범에서 확인해 주세요.", "photos": [], "videos": [], "sourceIds": ["1464818337"], "sourceCount": 1}, {"id": "1465527039", "date": "2026-10-15", "className": "채송화반", "content": "윤이는 오늘 오전간식 짜요짜요 반정도 먹고 놀이 시작했어요\n\n오늘은 단풍잎, 은행잎, 참나무 잎을 교실 천장에 매달아 가을 자연물을 탐색해 보았어요.\n손으로 나뭇잎을 톡톡 건드려 보기도 하고, 나뭇잎의 색깔을 말로 표현해 보았답니다.\n윤이는 노란 은행잎이 거꾸로 달려있는 것을 보고는 '하트모양 같아'하고 연상되는 모습을 이야기해 주었답니다\n윤이의 이야기에 옆에 있는 도토리나무의 나뭇잎은 어떤 모양 같은지 물어보니 윤이는 모기 같다고 답해주었답니다\n\n나뭇잎 놀이 즐겁게 한 뒤에는 미세먼지가 좋아 당산공원에서도 바깥놀이를 즐겼어요.\n공원에서 나뭇잎과 다양한 자연물을 손으로 만지며 탐색하고, 나뭇가지를 들고 나무를 살살 긁어보며 놀이했답니다.\n투명 풍선 안에 알록달록한 나뭇잎을 넣어보며 가을의 색깔을 담아보는 시간도 가졌어요.\n자연물을 오감으로 경험하며 즐겁게 놀이한 하루였답니다.\n\n신나게 놀이하고 점심 불고기 숙주나물 골고루 먹었어요\n\n윤이 오늘 놀이는 잘하였는데 평소보다 기운이 없는 모습이어서 물어보니 코가 막혀 불편하다고 하였어요\n가정에서도 한번 살펴봐주세요", "photos": [{"src": "media/1465527039/photo-001.jpg", "thumbnail": "media/1465527039/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1465527039/photo-002.jpg", "thumbnail": "media/1465527039/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1465527039"], "sourceCount": 1}, {"id": "1466265168", "date": "2026-10-16", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 어제 천장에 매달린 나뭇잎을 말랑한 자석으로 톡톡 치며 놀이하는 모습이 보여, 긴 막대(백업)를 제공해 주었어요.\n교실 바닥에 큰 전지를 깔고 단풍잎과 은행잎을 붙여주었더니, 백업으로 바닥에 있는 나뭇잎을 두드려 보기도 하고 천장에 매달린 나뭇잎을 치며 놀이하기도 했답니다. 나뭇잎의 움직임을 살펴보며 즐겁게 놀이를 이어갔어요.\n신나게 신체 놀이를 해보다가 친구가 양말목 끈을 백업에 끼우며 놀이하는 모습에 윤이도 열심히 양말목 끼우기 놀이를 해보았답니다\n(스스로 끈을 묶어보려 시도해보기도 하였어요)\n\n신체 놀이 뒤에는 커다란 전지 위에 그려진 나뭇잎 그림을 살펴보며 사인펜과 색연필로 자유롭게 끼적여 보았어요.\n교사가 손을 대고 윤곽선을 따라 그려주자 나뭇잎을 살펴보며 “단풍잎”이라고 표현했답니다. 단풍잎 그림 위에 스티커도 자유롭게 붙이며 나만의 방식으로 가을 나뭇잎을 꾸며보았어요.\n\n다가오는 작품 전시회에 게시할 현수막도 함께 꾸며보았어요. 내가 좋아하는 색의 반짝이는 스티커를 골라 원하는 곳에 자유롭게 붙이며 현수막을 예쁘게 꾸며주었답니다.\n\n교실놀이 즐겁게 하고 미세먼지 농도가 좋아 4층 옥상놀이터에서도 놀이했어요.\n따뜻한 햇볕 아래에서 자동차와 미끄럼틀을 타고, 모래놀이도 즐기며 신나는 시간을 보냈답니다.\n윤이는 서유와 테이블에 앉아 맛있는 밥을 지어 놀이했답니다\n\n점심은 김가루에 밥을 비며 한 그릇 뚝딱 먹었어요~\n\n*2027년도 재원 신청서를 보내드립니다. 작성하신 후 10월 21일(수)까지 보내주시기 바랍니다.", "photos": [{"src": "media/1466265168/photo-001.jpg", "thumbnail": "media/1466265168/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1466265168/photo-002.jpg", "thumbnail": "media/1466265168/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1466265168"], "sourceCount": 1}]</script>
