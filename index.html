며 탐색도 해보았답니다\n윤이는 단어보다는 동요를 듣는 것이 즐거운지 동요를 번갈아가며 들어보았는데 벽보에 있는 거의 대부분의 노래를 알고 따라 불러주기도 하였어요\n\n자유놀이 뒤에는 금요일에 이어 수수깡 오감 놀이를 해보았어요. 잘라놓은 수수깡을 투명 비늘 위에 올려 지붕을 만들어 주자 손가락으로 가리키며 탐색하는 모습이 보였어요. 선생님 도움을 받아 비닐을 쳐 움직이는 수수깡도 탐색해 보았답니다\n알록달록한 수수깡을 컵 안에 넣는 놀이도 즐겼어요. 입구가 큰 컵에는 쉽게 넣어보고, 뚜껑을 닫아 작은 구멍으로는 천천히 넣어보며 집중하는 모습이 보였답니다.\n테이크아웃컵 뚜껑을 닫아 제공하니 마라카스처럼 흔들어 보며 소리를 탐색했고, 작은 구멍 아래로 수수깡이 비처럼 떨어지는 모습을 신기하게 바라보았어요. 윤이는 긴 수수깡을 넣어 빨대 흉내를 내보기도 하고 생일초처럼 후~ 불어보기도 하며 다양한 방법으로 놀이해 보았답니다\n\n교실놀이 즐겁게 한 뒤에는 통합대기 상태가 좋지 않아 공동놀이실에서 선생님 도움을 받아 미끄럼틀과 자동차를 타며 신체활동을 했어요. 계단을 오르며 운동을 하고 내려올 때는 엘리베이터를 타보며 다양한 이동 경험을 쌓았어요.\n\n점심은 오늘 윤이가 도전하기에는 어려운 반찬들이었는지 밥만 두 그릇 먹었어요", "photos": [{"src": "media/1370050373/photo-001.jpg", "thumbnail": "media/1370050373/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1370050373/photo-002.jpg", "thumbnail": "media/1370050373/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1370050373"], "sourceCount": 1}, {"id": "1370784940", "date": "2026-03-31", "className": "채송화반", "content": "윤이는 오늘 오전간식이었던 씨리얼의 우유만 먹고 놀이를 시작해보았어요\n처음에는 간식을 정리한 뒤에도 자리에서 일어나지 않아 의아했는데 알고보니 우유를 더 먹고 싶었던 것이더라구요\n우유 한컵 따라주니 맛있게 먹고 기분좋게 일어나 선생님과 그림을 그리며 아침을 시작해보았답니다\n\n여러가지 동물 그림을 그리며 놀이해본 뒤 어제 수수깡 오감 놀이를 하면서 테이크아웃 컵에 붙여진 스티커를 붙이고 떼는 모습이 관찰되어 오늘은 거미줄을 만들어 주었어요. 거미줄 위에 거미를 그려주어 수수깡을 자유롭게 붙였다 떼었다 놀이를 해보았어요.\n수수깡 붙이기를 재미있어하는 윤이를 위해 접시에 수수깡으로 머리카락도 더 표현해 보기도 하였답니다\n\n수수깡 놀이 뒤에는 유기농 스틱 오감놀이를 해보았어요. 두 겹으로 되어 있어 과자를 빼었다 넣었다 하며 재미와 함께 먹는 즐거움을 보였어요.\n알록달록 앵두콘을 제공해 주어 모양과 색깔을 탐색해 보았어요. 윤이는 쑥 과자를 꺼낸 뒤 사이의 구멍으로 주변을 관찰해보기도 하였어요\n\n점심 어묵국의 어묵 한번씩 시도해보았으나 먹는 것 까지는 성공하지 못하고 밥은 다 먹었어요\n\n점심 식사 후 미세먼지 ‘좋음’으로 4층 놀이터에서 따뜻한 햇볕을 느끼며 선생님 도움으로 미끄럼틀, 자동차, 모래놀이를 해보았어요.", "photos": [{"src": "media/1370784940/photo-001.jpg", "thumbnail": "media/1370784940/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1370784940/photo-002.jpg", "thumbnail": "media/1370784940/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1370784940"], "sourceCount": 1}, {"id": "1371485149", "date": "2026-04-01", "className": "채송화반", "content": "오늘 윤이는 오전간식 떠먹는 요구르트 한 개 맛있게 먹고 놀이를 시작해 보았어요\n(얼마 남지 않았을 때 도와주려 했더니 스스로 먹겠다고 표현하는 윤이었답니다)\n\n간식 맛있게 먹고 오늘은 다가오는 식목일을 맞이하여 야채와 과일 심기 놀이를 해보았어요. 당근, 딸기, 가지, 파프리카, 봄동, 냉이, 쑥 등 다양한 채소와 과일을 탐색하며 색과 모양을 살펴보고 작은 텃밭에 직접 꽂아보며 즐거운 시간을 보냈어요. 손으로 만지고 눈으로 관찰하며 자연의 변화를 느끼는 모습이 참 생동감 있었어요.\n\n텃밭 놀이 즐겁게 해 본 뒤에는 미세먼지 ‘좋음’으로 당산공원으로 산책을 다녀왔어요. 공원에 활짝 핀 목련, 벚꽃, 진달래를 함께 감상하며 봄꽃의 아름다움을 탐색했어요. 꽃 스틱을 제공해 주었더니 한 손에 들고 다니며 놀이해 보았답니다. 떨어진 벚꽃을 주워보며 자연을 가까이 느끼는 시간을 가져보았답니다\n\n윤이는 처음 공원에 들어갈 때 흙이 있는 곳에서는 걷는 것이 어색한지 선생님 손을 꼭 잡고 이동하는 모습이었어요\n잠시 선생님과 자연에 친숙해지는 시간을 갖고 난 뒤에는 스스로 자신감이 생기는지 손을 놓고 솔방울도 주워보고 공원의 이곳저곳을 오가며 구경도 해보는 윤이었답니다\n오늘 하루, 자연 속에서 다양한 색과 향기를 경험하며 계절의 변화를 몸소 느껴보았어요.\n\n점심은 하이라이스는 카레만큼 맛있지는 않은지 밥 두 세 수저에 한번 정도 살짝 찍어먹고 푸딩은 과일이 없는 부분만 먹어보았어요\n브로콜리 맛살 샐러드의 맛살은 한번 입에 넣어보는 시도 해보았답니다\n\n*오늘 공원 다녀온 뒤 대변보았어요~", "photos": [{"src": "media/1371485149/photo-001.jpg", "thumbnail": "media/1371485149/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1371485149/photo-002.jpg", "thumbnail": "media/1371485149/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1371485149"], "sourceCount": 1}, {"id": "1372200702", "date": "2026-04-02", "className": "채송화반", "content": "윤이는 오늘 오전간식이었던 고구마바 맛있게 먹고 우유도 두 컵 든든히 먹고 아침을 시작해 보았어요\n('이거 고구마야?'하고 여러 번 확인하고 먹는 윤이었어요)\n\n아이스크림 막대에 붙여진 꽃을 붙였다 떼었다 하는 모습이 보여 어제 당산공원에서 본 벚꽃을 회상하며 나무를 그려주어 제공해 주었어요. 알록달록 꽃을 탐색하며 붙였다 떼어보는 놀이를 해보았답니다. 윤이는 신나게 꽃을 붙인 뒤 바닥에 떨어진 백업 꽃잎들을 주워 발가락에 끼운 뒤 바구니에 발로 넣는 묘기를 보여주었답니다. 꼼실꼼실 발가락에 힘을 주었다가 바구니 위에서 발가락을 움직여 넣는 모습이 정말 귀여웠어요\n\n꽃잎 붙이기 뒤에는 진달래, 벚꽃, 목련, 개나리 꽃을 물병에 담아 제공하니 색과 모양을 탐색해 보았고, 꽃 그림 카드와 비교하며 관찰해 보았어요. 꽃을 보며 이름과 색을 알아보는 시간도 가져보았어요. 윤이는 지난번에 물어보았던 개나리꽃이 제일 마음에 드는지 개나리꽃을 열심히 탐색해 보았답니다\n\n교실놀이 즐거겝 한 뒤에는 초미세먼지 ‘나쁨’으로 실외활동이 어려워 2층 공동놀이실에서 놀이를 이어갔어요. 흔들 말 타기, 아기 유모차 끌어보기, 촉감 발판을 걸어 다니며 다양한 신체활동을 경험해 보았어요. 윤이는 교실에는 없던 핸드벨 악기에 관심을 보이며 신나게 악기연주도 해보았답니다\n\n점심은 오늘 현미밥의 질감이 마음에 들지 않는지 먹지 않으려 해 밥을 먹지 않으면 배가 고파 조금은 먹어야 한다고 이야기 나누며 3분의 1 정도 먹어보았어요", "photos": [{"src": "media/1372200702/photo-001.jpg", "thumbnail": "media/1372200702/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1372200702/photo-002.jpg", "thumbnail": "media/1372200702/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1372200702"], "sourceCount": 1}, {"id": "1372907709", "date": "2026-04-03", "className": "채송화반", "content": "윤이는 오늘 오전간식 바나나 두 조각 먹고 난 뒤 그만 먹고 싶다고 표현해 정리하고 놀이를 시작해 보았어요\n\n오늘 윤이는 잠시 어떤 놀이를 해볼까 고민이 되는지 자리에 앉아 교실을 둘러보다가 봄아 어디 있니? 책을 꺼내와 책을 보며 아침을 시작해 보았어요\n\n플립 속에 어떤 봄이 숨어있을지 윤이에게 물어보니 윤이는 선생님이 들려주었던 내용을 기억하고는 '개구리'가 있을 것 같다고 답해주었답니다\n\n책 보기 뒤에 오늘은 식목일(4월 5일)을 맞아 방울토마토의 성장 과정을 함께 알아보고, 직접 물을 주며 “무럭무럭 자라거라”라는 응원의 말을 건네주었어요. 작은 이름표도 꽂아주며 생명의 소중함을 느껴보는 시간을 가졌답니다.\n윤이는 선생님이 알려주는 방울토마토의 성장과정에 많은 관심을 나타내주었어요\n노란 꽃도 피고 초록 열매가 빨갛게 변하면 먹을 수 있다는 이야기에 선생님 이야기를 따라 말해보며 기억하려는 모습이었답니다\n\n이어진 활동에서는 습자지 오감 놀이를 했습니다. 습자지를 자유롭게 찢어 날려보기도 하고, 이불처럼 덮어보며 다양한 감각을 경험했어요. 습자지를 뭉쳐 나무에 붙여 벚꽃을 만들어 주며 봄의 아름다움을 표현해 보았습니다.\n윤이는 선생님을 따라 친구들에게 뿌려주는 것을 제일 즐거워하였어요\n\n교실놀이 뒤 오늘은 초미세먼지와 미세먼지 ‘나쁨’으로 인해 실외 활동 대신 공동놀이실에서 선생님과 함께 계단 오르기 운동을 했습니다. 미끄럼틀과 자동차를 타며 자유롭게 놀이하며 즐거운 시간을 보냈습니다.\n\n점심은 감잣국 국물이 마음에 들었는지 국물과 함께 점심 먹었어요\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~\n\n*윤이 기저귀 보내주세요~", "photos": [{"src": "media/1372907709/photo-001.jpg", "thumbnail": "media/1372907709/thumb-photo-001.jpg", "width": 1920, "height": 3466}, {"src": "media/1372907709/photo-002.jpg", "thumbnail": "media/1372907709/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1372907709"], "sourceCount": 1}, {"id": "1373847119", "date": "2026-04-06", "className": "채송화반", "content": "주말 잘 보내셨나요?\n윤이는 오늘 마시는 요구르트 맛있게 먹고 난 뒤 교실 바닥에 생긴 꽃 발자국에 흥미를 보이며 아침을 시작해 보았어요\n윤이는 노란색을 좋아한다고 표현하며 여러 가지 꽃 사진 들 중에서도 노란색 꽃들에 흥미를 보여주는 윤이었답니다\n\n자유놀이 즐겁게 한 뒤에는 금요일에 진행했던 습자지 오감놀이에 흥미를 보여 오늘도 같은 놀이를 이어갔어요. 다양한 색의 습자지를 자유롭게 찢어보기도 하고, 공중으로 날려보며 촉감과 움직임을 즐겼어요. 습자지를 봉지에 넣어 나비를 만들어주니 손잡이를 잡고 이동하며 놀이를 확장하는 모습도 보였어요. 윤이는 습자지를 목도리처럼 목에 둘러보기도 하고 친구들에게 비를 내려주기도 하였답니다. 나비는 한동안 들고 다니며 나비가 날아가는 모습을 표현해보기도 하였어요\n\n습자지 놀이 뒤에는 보석 스티커와 꽃 스티커를 제공하자, 자신의 얼굴이 인쇄된 에바 알머슨 그림 위에 자유롭게 끼적이거나 스티커를 붙이며 표현하는 활동을 했어요. 윤이는 작품을 완성하자 선생님에게 건네주며 벽에 전시해 달라고 요청하였답니다\n\n교실놀이 즐겁게 한 뒤 우천으로 인해 공동놀이실에서 미끄럼틀과 자동차 놀이를 했고, 선생님과 함께 계단을 오르내리며 신체활동도 경험해 보았어요.\n\n점심은 오늘 콩나물국의 국물이 마음에 들었는지 두 그릇 든든히 먹고 미트볼과 열무나물을 한 번씩 맛을 보았어요 나물은 뱉었지만 미트볼을 작은 조각 조금 먹었답니다~", "photos": [{"src": "media/1373847119/photo-001.jpg", "thumbnail": "media/1373847119/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1373847119/photo-002.jpg", "thumbnail": "media/1373847119/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1373847119"], "sourceCount": 1}, {"id": "1374555218", "date": "2026-04-07", "className": "채송화반", "content": "윤이는 오늘 오전간식 오렌지는 먹고 싶지 않다고 표현해 먹지 않고 놀이를 시작해 보았어요\n\n오늘 날씨도 좋고 미세먼지도 없어 윤이에게 '친구들 다 오면 놀이터 가자~'하고 이야기해 주었더니 '왜 친구들이 안 오지?' 하며 친구를 기다리는 윤이었답니다 한동안 놀이하고 난 뒤 몇 명의 친구가 오지 않자 'OO 이는 언제 와?' 하며 등원하지 않은 친구를 확인하기도 하는 윤이었어요\n\n친구들이 빨리 등원하길 기다리며 오늘은 튤립, 민들레 등 꽃 모양 퍼즐(1~4조각)을 맞추며 꽃의 색과 모양을 탐색해 보았어요.\n같은 모양의 스티커를 붙여 맞추기 놀이도 하며 즐겁게 집중하는 시간을 가졌어요.\n윤이는 4조각 퍼즐의 위치는 맞추는데 방향을 돌리는 것이 조금 어려운지 자리 위로만 퍼즐을 맞추며 놀이해 보았답니다\n스티커로 힌트를 제시해 준 퍼즐은 맞추기보다는 스티커의 그림에 더 많은 관심을 보여주는 윤이었어요\n\n친구들 기다리며 교실놀이 즐겁게 한 뒤에는 미세먼지가 ‘좋음’으로 당산공원으로 산책을 다녀왔어요.\n공원 주변을 걸으며 벚꽃이 떨어진 길을 지나고, 바람에 흩날리는 꽃잎을 관찰하며 자연의 변화를 느껴보았어요.\n알록달록 피어난 꽃들을 탐색하고, 비눗방울을 잡는 활동도 즐겼어요.\n윤이는 아직 흙길이 편안하지 않은지 흙길을 이동할 때에는 선생님 손을 찾는 모습이었어요\n선생님 손잡고 몇 분 이동하며 익숙해지고 난 뒤에는 스스로 민들레도 찾아보고 개미를 찾으러 가기도 해 보았답니다\n\n점심은 밥은 두 번 든든히 먹었는데 오늘 반찬이 윤이에게 조금 허들이 높았는지 먹지는 않았어요", "photos": [{"src": "media/1374555218/photo-001.jpg", "thumbnail": "media/1374555218/thumb-photo-001.jpg", "width": 1920, "height": 1440}, {"src": "media/1374555218/photo-002.jpg", "thumbnail": "media/1374555218/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1374555218"], "sourceCount": 1}, {"id": "1375272405", "date": "2026-04-08", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 어제 당산공원에서 본 알록달록한 꽃을 회상하며 오늘은 꽃 사진 위에 스티커와 색연필로 끼적이기를 해보았어요.\n끼적이기 놀이 뒤에는 선생님이 친구에게 만들어준 와플블록 자동차를 보고 관심을 보이며 다가와 '이거 자동차야?'하고 물어보며 놀이를 시작해 보았답니다. 오늘은 평소의 자동차 모양과 다르게 옆부분에 블록을 한 개씩 더 끼워주었는데 윤이 그 블록을 보더니 '여기에 발 올리는 거야?'하고 물어보며 선생님의 의도를 정확히 파악해 이야기해주기도 하였답니다\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 좋음으로 당산공원으로 산책을 다녀왔어요.\n가는 길에 요구르트 아주머니를 만나 요구르트를 구입해 돗자리에 앉아 봄 날씨를 느껴보며 맛있게 먹고 놀이를 해보았어요\n비눗방울을 탐색하며 잡아보고, 바람 따라 날아가는 모습도 신기하게 바라보았어요.\n자연물을 직접 만지며 탐색해 보며 감각을 경험해 보았고, 공원에 지나가는 강아지와 비둘기를 보며 언어로 표현해 보는 모습도 보였답니다.\n\n점심은 볶음밥에 다른 재료가 섞이지 않은 부분 잘 먹고 흰밥 추가로 먹었어요 만두의 치즈만 조금 먹어보았는데 더 먹고 싶지는 않다고 해 맛만 보았어요", "photos": [{"src": "media/1375272405/photo-001.jpg", "thumbnail": "media/1375272405/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1375272405/photo-002.jpg", "thumbnail": "media/1375272405/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1375272405"], "sourceCount": 1}, {"id": "1375967469", "date": "2026-04-09", "className": "채송화반", "content": "윤이는 오늘 오전간식이었던 한우야채죽은 쌀만 있는 부분 한 수저 먹어보고 난 뒤 그만 먹고 싶다고 표현해 정리하고 놀이를 시작해 보았어요\n\n교실 천장에 매달아 놓은 꽃 풍선을 보고 신나게 풍선을 쳐보며 놀이를 시작해 보았답니다\n풍서 놀이 뒤 오늘은 어제 당산공원에서 보았던 벚꽃을 떠올리며, 교실에서 벚꽃과 끼우기 판을 제공해 주었어요.\n작은 구멍에 벚꽃을 천천히 끼워 넣으며 소근육을 조절하는 경험을 했어요.\n완성된 모습을 탐색하며 즐거워했고, 다시 벚꽃을 빼며 놀이를 이어갔답니다.\n윤이는 처음에는 꽃잎 부분을 잡고 끼우려 시도해 갈색 부분인 꽃줄기를 잡고 끼우면 더 쉽다고 방법을 알려주자 금방 줄기 부분을 잡고 끼우기를 해보았답니다. 판에 끼우기 놀이를 해본 뒤에는 천사점토를 종이컵에 담아 꽃꽂이 놀이도 해보았는데 윤이는 점토를 보고는 점토 놀이에 집중하는 모습이었어요 (점토 놀이하다 점토 위에 앉으며 바지에 묻어 여벌옷으로 갈아입었습니다)\n\n교실놀이 즐겁게 하고 난 뒤 비가 오는 날이라 공동놀이실에서 활동을 했어요.\n미끄럼틀을 타고 자동차 놀이를 하며 신체 활동을 즐겼어요. 선생님과 함께 계단을 오르며 균형을 잡는 연습을 했고, 내려올 때는 안전하게 엘리베이터를 타고 왔어요.\n\n점심은 국물만 조금 먹어보고 밥은 두 그릇 먹었어요", "photos": [{"src": "media/1375967469/photo-001.jpg", "thumbnail": "media/1375967469/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1375967469/photo-002.jpg", "thumbnail": "media/1375967469/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1375967469"], "sourceCount": 1}, {"id": "1376631370", "date": "2026-04-10", "className": "채송화반", "content": "윤이는 오늘 오전간식 선식은 한입 먹어본 뒤 더 먹지는 않아 정리해 주었어요\n(좋아하는 우유인 것 같기는 한데 선식 가루가 섞여있어 먹을까 말까 고민하는 것 같았어요. 10분 정도 기다려주며 먹을지 놀이할지 물어보았는데 더 먹지 않았답니다)\n\n간식을 정리한 뒤에는 친구가 와플블록을 높이 끼워 구성하는 모습을 보고 윤이도 블록 끼우기 놀이를 해보았어요\n높이높이 끼워본 뒤 창문처럼 구멍사이로 선생님 친구들을 바라보기도 하며 놀이해 보았답니다\n\n자유놀이 뒤에는 어제 벚꽃 끼우기 놀이에 이어 오늘은 벚꽃과 비슷한 팝콘 오감 놀이를 해보았어요.\n팝콘 기계에서 나오는 팝콘을 탐색하고, 투명 컵에 담아 흔들며 소리와 움직임을 느껴보았어요.\n노란색 종이컵에 넣었다 빼며 먹는 즐거움도 경험했답니다.\n팝콘과 마카로니의 모양과 색, 맛을 비교하며 다르게 생긴 모습을 탐색하는 오감 놀이를 즐겼어요.\n윤이는 소금도 기름도 들어가지 않은 팝콘이었는데도 입맛에 딱 맞았는지 놀이시간 동안 다람쥐처럼 오물조물 열심히 팝콘 맛을 보며 놀이해 보았답니다\n\n오감놀이 즐겁게 한 뒤에는 ‘꼭꼭 숨어라’ 도서를 보며 동물과 곤충 친구들을 알아보는 시간을 가져보고 우천으로 인해 공동놀이실에서 자동차와 미끄럼틀, 비지쥬 놀이를 하며 신체 활동을 했고, 선생님 손을 잡고 계단 운동을 해보았어요.\n\n점심은 된장국에 밥 한 그릇 뚝딱 먹었어요 윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~", "photos": [{"src": "media/1376631370/photo-001.jpg", "thumbnail": "media/1376631370/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1376631370/photo-002.jpg", "thumbnail": "media/1376631370/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1376631370"], "sourceCount": 1}, {"id": "1377518859", "date": "2026-04-13", "className": "채송화반", "content": "주말 잘 보내셨나요?\n\n윤이는 오늘 오전간식 사과는 먹지 않겠다고 표현해 간식은 먹지 않고 놀이를 시작해 보았어요\n\n오늘은 개구리를 주제로 놀이를 해보았답니다\n\n개구리 그림 위에 끼적이기를 한 뒤 코끼리 피리를 붙여 후후 불어 보는 놀이를 해보았지요\n후 불면 나오는 피리는 개구리의 긴 혀와 닮았다는 이야기를 하며 놀이해 보았답니다\n윤이는 소리를 내는 것까지는 성공하지 못하였는데 피리가 나오게 만드는 것까지는 성공해 한참을 자리에 앉아 피리를 불며 놀이해 보았어요\n개구리 피리를 불어보면서는 자연스럽게 개구리에 대한 관심이 나타나 개구리의 모습을 사진으로 함께 탐색해보기도 하였답니다\n개구리 눈도 찾아보고 겉으로 드러나지는 않지만 눈 뒤쪽에 있는 고막도 함께 찾아보았어요\n\n개구리 피리 놀이 뒤에는 대근육을 사용해 개구리처럼 연잎 위를 뛰어보기도 하고 개구리 장난감으로 소근육을 활용하는 점프 놀이도 해보았어요. 손가락으로 누름판 끝을 눌러 개구리를 뛰게 해 보았답니다\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 나쁘지 않아 당산 공원에도 가보았어요\n가는 길에 보니 공원 옆 구청 앞마당에 장터도 열려 어떤 것들을 파는지 구경도 해보고 뻥튀기도 한 개씩 선물 받아 공원에서 맛있게 먹고 놀이해 보았답니다. 지난주와 다르게 많이 피어난 라일락도 보고 개미들도 찾아보며 봄을 느끼고 돌아왔어요\n\n점심은 카레소스에 밥 한 그릇 뚝딱 먹었답니다\n\n*내일부터 채송화반의 1학기 상담이 시작됩니다 공지사항의 상담 시간 확인해 주세요", "photos": [{"src": "media/1377518859/photo-001.jpg", "thumbnail": "media/1377518859/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1377518859/photo-002.jpg", "thumbnail": "media/1377518859/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1377518859"], "sourceCount": 1}, {"id": "1378234640", "date": "2026-04-14", "className": "채송화반", "content": "윤이는 오늘 오전간식 누룽지죽 조금 먹고 놀이를 시작해 보았어요\n\n등원하자마자 제일 궁금했던 곤충 벽보에 관심을 보여주는 윤이었답니다\n곤충 사진을 보며 곤충의 이름과 생김새 등을 알아보고 그림자를 보고 알맞은 위치를 찾아 붙여보는 그림자 퍼즐 놀이도 해보았지요\n그림자와 사진을 맞춰보며 관찰력도 길러보며 놀이해 보았답니다\n신나게 놀이하던 중간 지렁이가 사라져 '어? 지렁이 어디 갔지?'하고 선생님이 찾는 소리를 듣고는 '지렁~'하고 지렁이를 찾아 불러주는 귀여운 윤이었어요\n\n교실놀이 즐겁게 한 뒤에는 소방대피 훈련도 해보았어요\n불이 났을 때 안전하게 대피하는 방법도 알아보며 손으로 코와 입을 가리는 연습도 해보았답니다.\n안전하게 소방 대피 훈련을 한 뒤에는 날씨가 좋아 당산 공원으로 실외 놀이를 나가보았어요\n\n오늘은 애벌레 주머니를 가지고 나가 애벌레에게 자연물 먹이 주기 놀이를 해보았어요\n공원에 있는 작은 솔방울, 나뭇잎, 꽃잎 등 여러 자연물을 주워 애벌레 주머니에 넣어보며 다양한 자연물을 접해보았답니다.\n어떤 자연물을 애벌레가 좋아할지 상상해 보며 공원에 가니 평소 자연물을 주워 놀이해 보던 것과 달리 꽃을 열심히 모아주었답니다.\n윤이는 돌멩이도 넣고 싶어 하였는데 주머니가 찢어질 수도 있고 애벌레가 돌멩이를 먹으면 배가 아플 수 있다고 알려주자 주머니에는 넣지 않고 들고 다니며 놀이해 보았어요\n\n점심은 순두부백김칫국 국물과 밥 두 번 든든히 먹었답니다~", "photos": [{"src": "media/1378234640/photo-001.jpg", "thumbnail": "media/1378234640/thumb-photo-001.jpg", "width": 1920, "height": 1080}, {"src": "media/1378234640/photo-002.jpg", "thumbnail": "media/1378234640/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1378234640"], "sourceCount": 1}, {"id": "1378935891", "date": "2026-04-15", "className": "채송화반", "content": "윤이는 오늘 오전간식 시리얼의 우유 맛있게 먹고 놀이를 해보았어요\n\n오늘은 봄 곤충과 개구리를 주제로 놀이를 해보았답니다\n\n파리를 잡아 개구리 입속에 쏙쏙 넣어주는 놀이를 해보며 소근육을 조절해 담고 쏟는 놀이와 개구리의 먹이에 대해 알아보고 봄 동물과 곤충 종이컵을 쌓으며 신체조절능력을 기르고 무너트리며 신나게 스트레스도 날려보았답니다\n\n미술놀이로는 곤충 선캐쳐를 만들어보았어요\n여러 곤충 도안들 중에 마음에 드는 곤충 그림을 고른 뒤 알록달록 셀로판지를 붙여 선캐쳐를 꾸며보았지요\n선캐쳐를 만들기 전 커다란 셀로판지를 탐색해 보며 셀로판지에 빛이 투과되어 색이 다르게 보이는 것을 느껴보고 놀이를 해서인지 신중히 색을 골라 붙여주었답니다. 윤이는 꿀벌을 골라 열심히 붙이고는 '윤이 꿀벌 저기 있어?'하며 내 작품이 어디있는지 확인하며 놀이하였어요\n\n교실놀이 즐겁게 하고 난 뒤에는 미세먼지가 나빠 공동 놀이실에서 신체 놀이를 해보았어요\n오늘은 무지개 블록과 촉감 매트에 많은 관심을 보여주었답니다\n\n점심은 짜장 소스 조금씩 찍어주니 잘 먹었어요\n\n*윤이 낮잠 전까지 열 나지 않아 해열제는 복용하지 않았습니다 (낮잠 후에도 체온 체크 한 뒤 열이나면 복용하도록 하겠습니다)\n*26년도 1학기 부모참여수업 신청서를 보내드립니다. 참여 여부를 작성하시어 17일 금요일까지 보내주세요", "photos": [{"src": "media/1378935891/photo-001.jpg", "thumbnail": "media/1378935891/thumb-photo-001.jpg", "width": 1920, "height": 3200}, {"src": "media/1378935891/photo-002.jpg", "thumbnail": "media/1378935891/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1378935891"], "sourceCount": 1}, {"id": "1379608621", "date": "2026-04-16", "className": "채송화반", "content": "윤이는 오늘 오전간식 짜요짜요 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 숨어있는 곤충 찾기 놀이를 해보았답니다\n나무와 잔디 그림 뒤에 어떤 곤충들이 숨어있는지 찾아보며 소근육을 조절해 보고 곤충들을 다 찾아본 뒤에는 어떤 곤충이 어디에 숨어있었는지 회상해 보며 곤충 찾기 놀이를 해보았지요\n윤이는 숨어있는 곤충을 찾으면서 진짜로 채송화반에서 잃어버린 그림자 퍼즐의 지렁이가 떠올랐는지 '지렁이는 진짜 어디 갔지?' 하며 찾아주기도 하였어요\n\n곤충 찾기 놀이 뒤에는 내가 잡고 싶은 봄 곤충 스티커 붙이기 놀이를 해보았어요\n개미, 무당벌레, 사슴벌레등 곤충 찾기 놀이를 해보며 보았던 곤충들을 스티커로 제시해 주자 관심을 보이며 채집통에 열심히 붙여주었답니다\n\n신나게 교실놀이 한 뒤에는 맑은 날씨에 오랜만에 놀이터에 나가보았어요\n모래놀이도 하고 탱탱볼 놀이도 해보았답니다\n윤이는 공놀이 먼저 즐겁게 한 뒤 모래놀이를 하는 모습이었어요\n\n*윤이 12시 40분 해열제 복용 후 1시 25분 38도로 체온 내려가고 있습니다\n(2시 40분에 다시 측정하여 발열 시 알림장 댓글 남기고 챔프 투약하겠습니다)\n*내일은 딸기 오감 놀이를 해볼 예정입니다. 딸기 물이 들 수 있으니 더러워져도 괜찮은 옷을 입고 등원할 수 있도록 해주세요", "photos": [{"src": "media/1379608621/photo-001.jpg", "thumbnail": "media/1379608621/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1379608621/photo-002.jpg", "thumbnail": "media/1379608621/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1379608621"], "sourceCount": 1}, {"id": "1380312888", "date": "2026-04-17", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹고 오이는 한번 앞니로 씹어보며 맛을 느껴보았어요\n\n간식을 다 먹은 뒤 오늘 딸기 놀이를 하기로 하였던 것을 기억하고 '딸기 주물러서 딸기우유 만들 거야?'하고 물으며 오늘 하게 될 오감 놀이를 기대하는 모습을 보여주는 윤이었답니다\n\n친구들이 다 등원하고 간식을 먹고 난 뒤 놀이하기로 약속하고 친구들을 기다리며 벽면에 붙어있는 딸기의 사진을 함께 탐색해 보았어요\n딸기의 성장과정도 알아보고 딸기의 속 모양도 관찰해 보았답니다\n오감놀이 시간에는 꼭지가 있는 딸기, 가로, 세로 방향으로 다르게 자른 딸기의 겉과 속모양을 탐색해 본 뒤 딸기의 향기를 맡아보고 맛보 ": [], "sourceIds": ["1382607783"], "sourceCount": 1}, {"id": "1383333076", "date": "2026-04-23", "className": "채송화반", "content": "윤이는 오늘 오전간식 참외는 입에 넣어보았다가 더 먹지는 않고 놀이를 시작해 보았어요\n친구들의 등원을 기다리면서 그림 그리기, 스티커 놀이를 하며 아침을 시작하였답니다\n(윤이가 양 볼에 스티커를 붙인 것을 보고 친구가 따라 하자 '윤이랑 똑같네~'하고 말해주기도 하였어요)\n\n친구들이 다 등원한 뒤에는 따듯한 봄날씨에 교실에서 해보려 했던 무당벌레 무늬 꾸미기 도장놀이를 놀이터로 나가해 보았어요\n\n놀이터 한 곳에 돗자리를 펼친 뒤 도장과 무당벌레 그림을 보여주자 하나 둘 관심을 보이며 다가와 함께 도장놀이를 해보았답니다\n여러 가지 색과 모양이 있는 도장을 탐색해 보고 무당벌레의 등 위에 무늬를 찍어 만들어보았지요\n도장 놀이를 하면서는 선생님과 무당벌레의 등딱지에는 무늬가 있다는 이야기도 나누어보았어요\n\n도장놀이 즐겁게 하고 난 뒤에는 놀이터에서 비눗방울, 모래놀이 즐겁게 하고 선생님과 소그룹으로 나누어 어린이집 주변 산책도 해보았답니다\n산책을 하며 다양한 꽃도 보고 곤충박물관에 그려진 곤충 그림도 열심히 관찰해보기도 하였어요\n\n점심은 윤이가 좋아하는 잡채가 나와 맛있게 두 번 먹고 밥은 잡채를 많이 먹어서인지 3분의 2 정도만 먹고 더 먹지는 않았어요\n점심 먹고 기분이 좋아졌는지 교실의 전신 거울 앞에 서서 율동과 함께 노래를 열심히 불러주는 윤이었답니다~\n\n*내일은 봄나물 오감 놀이를 해보려 합니다. 풀물이 들 수 있으니 더러워져도 괜찮은 옷을 입고 등원할 수 있도록 해주세요~", "photos": [{"src": "media/1383333076/photo-001.jpg", "thumbnail": "media/1383333076/thumb-photo-001.jpg", "width": 768, "height": 1268}, {"src": "media/1383333076/photo-002.jpg", "thumbnail": "media/1383333076/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1383333076"], "sourceCount": 1}, {"id": "1384034698", "date": "2026-04-24", "className": "채송화반", "content": "윤이는 오늘 오전간식 요구르트 맛있게 먹고 당근도 한조각 맛보았어요\n(삼키지는 못했는데 씹으며 맛을 느껴보는 윤이었답니다)\n\n오늘은 봄을 맞아 향긋한 제철 나물들을 직접 만나보고 탐색해 보는 시간을 가져보았어요\n세발나물, 돌나물, 취나물, 방풍나물 등 다양한 나물을 살펴보며 각각의 생김새와 색깔, 잎의 모양을 자세히 관찰해 보았지요.\n손으로 만져보며 질감의 차이도 느껴보고 향을 맡아보며 나물마다 다른 향이 난다는 것도 느껴보았답니다\n또한 나물마다 맛이 조금씩 다르다는 점에 대해 이야기를 나누며 살짝 뜯어 맛을 보기도 하였답니다\n탐색 활동이 끝난 후에는 나물을 직접 잘게 뜯어보기도 하고 버부리는 흉내를 내보기도 하였답니다\n마지막에는 다른 나물에 비해 잎이 크고 넓은 방풍나물과 취나물에 쌈을 싸보는 놀이도 해보았답니다.\n나물쌈을 선생님, 친구에게 먹여주는 흉내도 내보았어요\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 나쁘지 않아 놀이터에 나가 모래놀이, 달리기 신나게 한 뒤 점심 먹었어요\n윤이 김에 밥 싸주니 맛있게 먹고 백김치 작은 조각 한개도 먹어보았어요 (김치는 뱉지 않고 잘 먹었답니다 폭풍칭찬 해주세요~)\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~\n\n*오늘은 신체 계측을 진행하였습니다. (키: 84 cm  몸무게: 10.5 kg )\n측정 결과는 상황에 따라 다소 차이가 있을 수 있으니 참고용으로 확인해 주세요", "photos": [{"src": "media/1384034698/photo-001.jpg", "thumbnail": "media/1384034698/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1384034698/photo-002.jpg", "thumbnail": "media/1384034698/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1384034698"], "sourceCount": 1}, {"id": "1384946015", "date": "2026-04-27", "className": "채송화반", "content": "주말 잘 보내셨나요?\n윤이는 오늘 오전간식 배 조금 먹고 난 뒤 그만 먹고 싶다고 표현해 정리를 하고 놀이를 시작해 보았어요\n오늘은 곤충 카드와 곤충 백과 책을 보았어요.\n거미, 잠자리, 메뚜기, 뱀, 무당벌레 등 곤충 모형을 살펴보며 생김새를 탐색하고 만져보는 경험을 해보았답니다.\n윤이는 곤충 모형 놀이보다는 책 보기에 집중하며 선생님에게 곤충의 이름을 물어보며 책을 보았답니다\n그중에서도 특히 애벌레에 관심이 많이 가는지 애벌레를 집중해 보는 윤이었어요\n\n교실놀이 즐겁게 하고 난 뒤에는 미세먼지 보통으로 1층 놀이터에서 모래놀이와 미끄럼틀, 흔들 말을 타며 즐겁게 놀이해보았어요.\n선생님 손을 잡고 어린이집 주변을 산책하며 시원한 바람을 느끼고 꽃과 나무를 탐색하며 산책도 해보았답니다\n산책을 가는 길에 비친 그림자에 대해 이야기를 해주자 처음에는 그림자가 정확히 어떤 것인지 몰랐는지 물어보는 윤이었어요\n윤이 그림자와 친구들 그림자를 알려주자 선생님의 이야기를 따라 말해보며 그림자를 확인해 보는 윤이었답니다\n\n점심은 밥 두 그릇 든든히 먹고 오늘은 백김치 2조각 성공하였어요~", "photos": [{"src": "media/1384946015/photo-001.jpg", "thumbnail": "media/1384946015/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1384946015/photo-002.jpg", "thumbnail": "media/1384946015/thumb-photo-002.jpg", "width": 1920, "height": 1440}], "videos": [], "sourceIds": ["1384946015"], "sourceCount": 1}, {"id": "1385640163", "date": "2026-04-28", "className": "채송화반", "content": "윤이는 오늘 오전간식 닭죽은 한 수저 맛을 보고 난 뒤 먹고 싶지 않다고 표현해 정리를 하고 놀이를 시작해 보았어요\n\n오늘은 곤충 그림을 찾아보는 놀이를 해보았답니다\n지퍼백 안에 든 말랑말랑한 수정토를 손으로 문지르며 곤충을 발견하고, 발견한 곤충을 자세히 탐색하며 즐겁게 활동했어요.\n윤이는 수정토의 크기에 관심을 보이며 커다란 수정토가 어디 있는지 물어보며 놀이를 해보았어요\n물을 조금 먹으면 크기가 작다고 알려주자 물을 많이 먹은 수정토가 어떤 것인지 물어보며 놀이를 해보았답니다\n이어서 나만의 미니 키링 파우치를 꾸미는 놀이도 진행했는데, 선생님 도움으로 스티커를 자유롭게 붙이며 개성 있는 작품을 완성했지요\n파우치에 붙이고 남은 작은 스티커들은 윤이 손바닥에 붙여보기도 하였어요\n(파우치에는 윤이가 좋아하는 물건을 담아 가방에 달아주셔도 좋을 것 같아요~)\n\n교실놀이 즐겁게 하고 난 뒤에는 미세먼지가 ‘좋음’으로 표시되어 바깥놀이도 즐겁게 할 수 있었어요.\n놀이터에서 탱탱볼로 신체 활동을 하고, 선생님 손을 잡고 어린이집 주변을 산책하며 시원한 바람과 주변 환경을 탐색하는 시간을 가졌습니다.\n\n점심시간에 배추김치 한 조각 먹은 뒤 같은 배추로 만든 배추 나물이라는 것을 알려주며 '나물은 말랑말랑하지?'하고 물어보니 '이건 부드럽다~'하고 답해주는 윤이었답니다~\n\n내일은 어린이날 행사가 진행됩니다.\n9시 30분까지 등원할 수 있도록 해주세요~", "photos": [{"src": "media/1385640163/photo-001.jpg", "thumbnail": "media/1385640163/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1385640163/photo-002.jpg", "thumbnail": "media/1385640163/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1385640163"], "sourceCount": 1}, {"id": "1386359742", "date": "2026-04-29", "className": "채송화반", "content": "오늘은 어린이날을 앞두고 오늘은 설렘 가득한 축제 시간을 가졌어요.\n\n먼저 오감 놀이를 통해 귀여운 꿀벌과 나비로 변신해 보았어요. 고사리 같은 손으로 꽃에서 꿀을 따 꿀단지에 쏙 넣어보기도 하고, 뿅망치를 들고 진딧물을 '톡톡' 잡아보며 즐거운 성취감을 느껴보았어요. 나비 날개가 달린 리듬 막대를 흔들며 나풀나풀 나비의 움직임을 몸으로 표현하는 모습이 정말 사랑스러웠어요. 윤이는 처음 매본 나비 날개가 어색한지 처음에는 제자리에서 움직이지 않다가 조금 익숙해진 뒤에는 나비 리본을 모두 모아 열심히 흔들어주었답니다\n\n민들레반 교실에서한 자연 탐색 시간에는 나무에 붙은 작은 곤충들을 관찰하고 조심스레 나뭇잎 위로 옮겨주며 생명의 소중함을 경험했어요. 무당벌레와 예쁜 꽃 그림이 그려진 돌멩이를 만져보고, 다양한 봄꽃들을 눈에 담으며 자연과 한층 더 친해지는 시간을 가졌어요.\n\n곤충 나라 여행 즐겁게 한 뒤에는 3층 공동놀이실로 이동해 꼬마 음악가로 변신했어요. 여러 가지 악기를 자유롭게 탐색하며 직접 연주도 해보고, 바이올린과 비올라, 첼로의 아름다운 현악 4중주 선율을 감상하며 음악에 맞춰 몸을 흔들흔들 움직이는 신체 표현 활동도 즐겼어요.\n\n신나게 활동한 후 먹는 점심은 미역국에 밥 두그릇  먹고 슬러쉬 대신 주스도 아주 맛있게 먹으며 든든하게 배를 채웠어요.\n\n*사진은 앨범에서 확인해 주세요", "photos": [], "videos": [], "sourceIds": ["1386359742"], "sourceCount": 1}, {"id": "1387056067", "date": "2026-04-30", "className": "채송화반", "content": "윤이는 오늘 오전간식 맛있게 먹고 놀이를 시작해 보았어요\n\n어제 진딧물 놀이에 이어 오늘은 수풀(초록색 습자지) 안에 다양한 곤충(뱀, 거미, 잠자리, 무당벌레)등 찾는 놀이를 해보았어요.\n뿅망치로 곤충도 잡아보고 진딧물도 잡아보았답니다. 잡은 곤충들과 진딧물을 담아볼 수 있도록 통을 주었는데 윤이는 곤충들 보다는 수풀을 담는 것이 더 좋은지 수풀을 열심히 통 안에 담아주었답니다\n놀이 초반에 수풀의 양이 너무 많아 조금 정리를 하기 위해 봉투에 담고 있었는데 윤이도 선생님을 담아 도와주었답니다\n(조금 하고 재미가 없었는지 '언제까지 담아야 해?'하고 물어 놀이하면 된다고 알려주었어요~)\n\n교실놀이 신나게 하고 난 뒤에는 미세먼지 보통으로 당산공원으로 산책 다녀왔어요.\n당산공원에서 오전간식으로 나왔던 맛있는 과자 간식도 먹고 개미, 자연물을 탐색해 보았답니다\n윤이는 선생님과 민들레 홀씨도 불어보고 까치도 함께 관찰해 보았답니다\n\n윤이 실외 놀이 후 많이 피곤했는지 졸기 시작해 12시부터 20분까지 조금 자고 난 뒤 점심 먹었어요\n점심 먹고 난 뒤에도 피곤함이 가시지 않는지 이불에서 조금 쉬다가 1시 조금 넘어 낮잠 들었습니다\n오늘 열은 없었는데 맑은 콧물이 있어 가정에서도 살펴봐주세요\n\n윤이와 건강하고 즐거운 연휴 보내시고 월요일에 뵙겠습니다\n\n*윤이 치약 다 사용해 새 치약 보내주세요~ (칫솔 마모도 확인해 주세요)", "photos": [{"src": "media/1387056067/photo-001.jpg", "thumbnail": "media/1387056067/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1387056067/photo-002.jpg", "thumbnail": "media/1387056067/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1387056067"], "sourceCount": 1}, {"id": "1387971984", "date": "2026-05-04", "className": "채송화반", "content": "연휴 잘 보내셨나요?\n윤이는 오늘 오전간식 인절미스낵과 우유 맛있게 먹고 하루를 시작해 보았어요\n(우유는 두 컵 든든히 먹었어요~)\n\n오늘은 5월이 되며 다양한 교통기관으로 놀이 주제가 바뀌며 다양한 탈것 놀이를 해보았답니다\n꼭꼭 숨은 자동차도 찾아보고 구름기차책을 집처럼 만들어 들어가 놀이해보기도 하였어요\n구름기차에는 다양한 모양 친구들이 타고 있었는데 여러 가지 모양에 관심이 많은 윤이는 모양을 떼어 들고 다니며 놀이해보기도 하였답니다\n\n선생님과는 데굴데굴 굴러가는 바퀴 도서를 보았어요.\n버스, 자동차, 트럭, 구급차, 소방차가 하는 일에 대해 알아보고 자동차 이름을 알아보는 시간을 가져보았지요\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 좋음으로 어린이집 인근에 있는 아파트 놀이터에서 놀이했어요.\n미끄럼틀과 흔들 말을 타보았고, 따뜻한 햇볕을 느껴보았답니다. 친구들이 그네에 배를 걸치고 타는 모습에 윤이도 친구를 모방해 배로 그네도 타보았답니다\n\n점심은 멸치볶음, 김치, 계란찜까지 골고루 먹었답니다~ (김치와 계란찜은 조금씩 먹었지만 칭찬 많이 해주세요~)\n\n내일은 어린이날입니다 윤이와 행복한 어린이날 보내시고 수요일에 뵙겠습니다~", "photos": [{"src": "media/1387971984/photo-001.jpg", "thumbnail": "media/1387971984/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1387971984/photo-002.jpg", "thumbnail": "media/1387971984/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1387971984"], "sourceCount": 1}, {"id": "1388636450", "date": "2026-05-06", "className": "채송화반", "content": "어린이날 잘 보내셨나요?\n윤이는 오늘 월요일에 선생님과 함께 보았던 데굴데굴 굴러가는 바퀴 동화책을 보며 아침을 시작해 보았어요\n동화책 제일 마지막에 동화에 나왔던 모든 자동차들이 한 번에 나와있는 페이지를 보며 소방차는 불을 끄러 간다는 것을 알아차리고는 경찰차는 어떤 일을 하러 가는지 물어보는 윤이었어요\n그림 속에 울고 있는 아이가 있어 울고 있는 친구를 도와주러 간다고 알려주었더니 트럭, 버스 등이 하는 일도 물어보는 윤이었답니다\n\n동화책 즐겁게 본 뒤에는 다가오는 어버이날을 위해 아빠, 엄마께 편지 쓰기를 해보았는데요.\n편지지 위에 끼적이기를 하며 \"아빠, 엄마 사랑해요\"라고 말해보기도 하였답니다.\n\n편지 쓰기 뒤에는 손끝놀이로 끈 끼우기 놀이도 해보았어요\n윤이는 선생님이 한번 놀이 방법을 알려주자 방법을 터득해 막대에 동물을 끼우고 손을 옮겨 동물이 끈 안으로 쏙 들어갈 수 있도록 들어주며 신나게 놀이해 보았답니다\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 좋음으로 당산공원으로 산책 다녀왔어요.\n공원에 핀 꽃에 아기 무당벌레들이 ], "videos": [], "sourceIds": ["1390875384", "1391060164"], "sourceCount": 2}, {"id": "1392436778", "date": "2026-05-13", "className": "채송화반", "content": "윤이는 오늘 오전간식 짜 먹는 요구르트 맛있게 먹은 뒤 알록달록한 자동차들을 같은 색끼리 찾아 제자리에 주차해 보는 재미있는 주차 놀이를 해보았어요.\n빨강, 주황, 노랑, 초록 등 무지개 색깔의 이름을 함께 알아보며 같은 색 주차장에 자동차를 하나씩 옮겨보았답니다.\n윤이는 자연스럽게 색 이름을 이야기해 주며 스스로 비교해 보고 알맞은 자리를 찾아 주차해 주었답니다\n\n주차 놀이를 마친 뒤에는 여러 자동차를 가까이에서 만나보기 위해 버스 정거장으로 나가보았어요\n버스 정거장이 어떤 장소인지 함께 알아보고, 사람들이 버스를 기다리는 곳이라는 것도 이야기 나누어 보았답니다\n정거장 주변에서는 커다란 버스뿐 아니라 레미콘, 트럭, 택배차 등 어린이집 주변에서는 자주 보지 못했던 다양한 자동차들을 만날 수 있었어요\n버스와 레미콘을 보고 '안녕~' 인사도 해주는 윤이었어요\n\n여러 가지 자동차를 만나본 뒤에는 어린이집 근처 놀이터로 이동하여 신체 놀이도 즐겨보았어요\n미끄럼틀을 타고, 뛰어다니며 친구들과 신나게 놀이하는 동안 어느새 여름이 다가오고 있는지 햇살이 제법 뜨겁게 느껴져, 놀이 중간중간 그늘에서 시원한 물을 마시며 충분한 휴식도 취해보았어요\n더운 날씨 속에서는 몸의 상태를 살피며 쉬어가는 것도 중요하다는 것을 자연스럽게 경험해 보는 시간이 되었답니다.\n\n윤이 점심 모든 반찬들을 모두 먹어보는 날이었어요 다 먹고 난 뒤 선생님에게 다음에는 당근도 먹어볼 거라고 이야기해 주는 멋진 윤이었어요\n폭풍칭찬해 주세요~\n\n*윤이 낮잠 전까지 열이 나지 않아 해열제는 복용하지 않았습니다. 낮잠 이후에도 체온 확인한 뒤 해열제 복용하게 되면 알림장 댓글 남겨두겠습니다", "photos": [{"src": "media/1392436778/photo-001.jpg", "thumbnail": "media/1392436778/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1392436778/photo-002.jpg", "thumbnail": "media/1392436778/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1392436778"], "sourceCount": 1}, {"id": "1393151134", "date": "2026-05-14", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹고 놀이를 시작해 보았어요\n\n건너가는 길 동요를 들으며 흥미를 보여주었던 신호등 색칠 놀이를 준비해 책상에 올려두었는데 간식을 먹으며 '어떤 거 해야 해?'하고 물어보던 윤이 간식을 먹자마자 바로 색연필을 꺼내 들고 놀이를 시작해 보았답니다\n빨간불 노란불 초록불 신호등 색의 의미를 알아보고 우리가 길을 건널 때에는 어떤 색 불에 길을 건너야 하는지도 함께 알아보며 신호등 색칠 놀이를 해보았어요\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 좋아 놀이터에 나가보았어요\n여러 가지 교통기관 모양틀에 모래를 넣어 놀이해보기도 하고 맛있는 음식을 만들어보기도 하는 등 오랜만에 모래놀이도 신나게 하고 혼자 걸어가는 친구가 외로워 보였는지 손을 잡고 함께 놀이터 산책도 해보는 윤이었어요\n\n윤이 다행히 낮잠 전까지 발열 없어 해열제는 복용하지 않았습니다. 낮잠 후에도 체온 확인하고 열이 나면 해열제 복용 후 알림장에 댓글 남겨두겠습니다.\n\n*내일은 신호등 카나페 만들기 놀이를 할 예정입니다. 과일이 사용될 예정이오니 더러워져도 괜찮은 옷을 입고 등원할 수 있도록 해주세요", "photos": [{"src": "media/1393151134/photo-001.jpg", "thumbnail": "media/1393151134/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1393151134/photo-002.jpg", "thumbnail": "media/1393151134/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1393151134"], "sourceCount": 1}, {"id": "1393875785", "date": "2026-05-15", "className": "채송화반", "content": "윤이는 오늘 교실 벽면에 붙여진 신호등 가랜드를 보고 가랜드에 있는 색과 오늘 사용할 재료들에 관심을 보이며 아침을 시작해 보았답니다.\n\n친구들이 거의 다 등원한 뒤, 기다리던 카나페 만들기를 시작해 보았어요.\n카나페를 만들기 전에 먼저 신호등 색의 의미를 알아보고, 빨강은 딸기, 노랑은 바나나, 초록은 청포도로 표현해 보았답니다.\n크래커 위에 치즈와 과일을 순서대로 올리는 과정이 처음에는 쉽지 않았지만, 달콤한 과일들과 함께하며 즐겁고 행복한 시간을 보낼 수 있었어요.\n\n카나페 만들기 놀이 후에는 선생님과 함께 「기차를 타요」 동화책도 읽어보았어요.\n기차를 타기 전 안전을 위해 뒤로 물러서야 한다는 내용과 차례를 지켜 기차를 이용하는 동물 친구들의 모습을 보며 기차에 관심을 가져보는 시간이 되었답니다.\n\n교실 놀이를 즐겁게 한 뒤에는 다행히 나빴던 초미세먼지 수치가 ‘보통’ 수준으로 좋아져 놀이터에도 다녀왔어요.\n어제 즐겁게 놀이했던 탈것 모양틀 모래놀이와 미끄럼틀 놀이를 오늘도 신나게 즐긴 뒤 교실로 돌아왔답니다.\n\n윤이 점심시간 37.7도로 열이 조금씩 오르더니 12시 지나 열이나 해열제 복용하였습니다\n점심은 열이 나서인지 평소 양의 반정도만 먹었어요\n\n윤이 오늘 밤 컨디션 잘 조절되어 가족여행 즐겁게 보내고 올 수 있기를 바래봅니다\n윤이와 즐거운 여행 보내시고 목요일에 뵙겠습니다~", "photos": [{"src": "media/1393875785/photo-001.jpg", "thumbnail": "media/1393875785/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1393875785/photo-002.jpg", "thumbnail": "media/1393875785/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1393875785"], "sourceCount": 1}, {"id": "1396821064", "date": "2026-05-21", "className": "채송화반", "content": "윤이는 오늘 오전간식 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 기차 꾸미기 놀이를 해보았답니다\n다양한 탈 것 스티커를 활용해 기차가 다니는 기찻길과 기차를 꾸며보았지요\n종이를 반으로 접어 기차를 붙일 예정이라 윤이에게 기찻길을 빼고 스티커를 붙여달라고 알려주니 다른 곳에 스티커를 붙일 때마다 확인을 하며 놀이해 보았답니다\n\n기차 꾸미기 놀이 뒤에는 소근육 힘을 키워보기 위해 기차 까꿍 놀이도 해보았어요\n고무줄로 연결된 기차를 쭉 잡아당겨 사이로 까꿍~ 놀이를 해보았지요\n처음에는 조금 힘들었지만 몇 번 놀이를 해보며 방법을 터득하고는 쭉~ 잡아당기며 친구들에게도 까꿍 놀이를 해보았어요\n나중에는 친구에게 '이거 어려운 거야~'하며 당기는 방법을 시범 보여주기도 하는 윤이었답니다~\n\n교실놀이 즐겁게 한 뒤에는 비가 와 나가지 못하는 대신 에어바운스 놀이 신나게 해 보았어요\n\n점심 김치와 순두부 맛있게 먹고 기분 좋게 낮잠 들었어요~\n\n*내일은 물감 놀이를 할 예정입니다. 더러워져도 괜찮은 옷을 입고 등원할 수 있도록 해주세요", "photos": [{"src": "media/1396821064/photo-001.jpg", "thumbnail": "media/1396821064/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1396821064/photo-002.jpg", "thumbnail": "media/1396821064/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1396821064"], "sourceCount": 1}, {"id": "1397520407", "date": "2026-05-22", "className": "채송화반", "content": "윤이는 오늘 물감 놀이를 할 거라는 이야기에 언제 물감을 하는지 물어보며 아침을 시작해 보았어요\n\n친구들이 어느 정도 등원하고 난 뒤 선생님과 스텐실 기법을 활용해 기차를 만들어보았어요.\n노란색 물감이 담긴 팔레트에 스펀지 붓을 콕콕 찍어 물감을 묻힌 뒤, 기차 도안이 붙어 있는 도화지 위에 물감을 찍어 표현해 보았답니다.\n\n물감을 모두 찍은 후에는 도안을 떼어내며 어떤 그림이 완성되었는지 함께 감상해보기도 했어요.\n완성된 작품을 교실 벽면에 게시해 주자 윤이는 얼굴 사진이 달린 집게를 확인하며 내가 만든 기차를 찾아보고 관찰해 보았답니다.\n\n미술놀이를 즐겁게 마친 뒤에는 오랜만에 맑은 날씨 속에서 놀이터에 나가 놀이를 해보았어요.\n오늘은 커다란 대왕 비눗방울과 작은 비눗방울을 잡아보는 놀이를 해보았답니다\n선생님이 불어주는 비눗방울을 잡아보는 놀이를 해본 뒤에는 스스로 불어보기도 하며 신나게 놀이하고 왔어요\n(비눗방울 놀이하며 윤이 외투에 비눗물이 묻어 가방에 넣어두었습니다)\n\n윤이와 건강하고 즐거운 주말 보내시고 다음 주에 뵙겠습니다\n(낮잠 후에도 체온 확인해 본 뒤 열이 지속되거나 더 오르면 연락드리겠습니다)\n윤이 양치도구와 이불은 다음주까지 사용후 보내드리겠습니다~\n\n*5월 26일(화)~27일(수)은 정수남 교사의 연차 휴가일로 채송화반 보육은 대체교사 선생님이 함께 해주실 예정입니다.", "photos": [{"src": "media/1397520407/photo-001.jpg", "thumbnail": "media/1397520407/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1397520407/photo-002.jpg", "thumbnail": "media/1397520407/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1397520407"], "sourceCount": 1}, {"id": "1398426561", "date": "2026-05-26", "className": "채송화반", "content": "주말 잘 보내셨나요?\n오늘은 지난 금요일에 즐겼던 스텐실 놀이에서 이어져 바퀴로 문질러 자국을 탐색하는 바퀴 놀이를 해보았어요. 노란색 물감에 흥미를 보였던 아이들에게 오늘은 노란색과 빨간색을 지퍼백 안에 넣어 제공했어요. 미나카를 물감 위로 지나가며 바퀴 자국을 관찰하고, 손으로 문지르며 물감 속에 숨겨진 구급차와 경찰차를 찾아보았어요.\n\n미세먼지 ‘보통’으로 놀이터에서도 신나게 활동했어요. 커다란 비눗방울을 터뜨리는 재미를 느끼고, 분무기를 사용해 식물들에게 물을 주며 소근육을 조절하는 활동도 했어요. 물을 주며 “쑥쑥 자라거라”라고 말해보았답니다.\n\n*내일은 자동차 바퀴 그림을 그려보려고 합니다. 물감이 묻어도 되는 옷을 입고 등원해 주시기 바랍니다.\n*사진은 앨범에서 확인해 주세요", "photos": [], "videos": [], "sourceIds": ["1398426561"], "sourceCount": 1}, {"id": "1399111755", "date": "2026-05-27", "className": "채송화반", "content": "오늘은 자동차 바퀴 그림 놀이를 해보았어요. 미니카와 자동차 바퀴를 직접 만져보고 탐색하며, 하늘색·초록색·노란색·빨간색 물감을 묻혀 광목천 위에서 앞으로 뒤로 움직이며 바퀴로 그림을 만들었답니다. 바퀴 자국이 만들어내는 다양한 무늬를 보며 즐거워했어요.\n\n자동차 스티커 북놀이를 하며 여러 교통기관을 알아보고, 그림을 보고 자유롭게 스티커를 붙이며 표현하는 시간을 가져보았어요\n\n미세먼지 ‘좋음’으로 어린이집 인근 놀이터로 이동했어요. 시원한 바람을 느끼며 미끄럼틀을 타고, 작은 개미를 찾아보며 자연을 탐색하는 시간을 보냈어요. 어린이집으로 돌아오는 길에는 트럭이 지나가는 모습을 보곤 트럭에 실은 물건(생수)을 궁금해하는 모습이 보였답니다.\n\n*사진은 앨범에서 확인해 주세요.", "photos": [], "videos": [], "sourceIds": ["1399111755"], "sourceCount": 1}, {"id": "1399841277", "date": "2026-05-28", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹은 뒤 놀이를 시작해 보았어요\n\n오늘은 윤이와 함께 좋아하는 색깔의 색종이를 직접 골라 자동차를 접어보았어요.\n선생님과 함께 색종이를 접은 뒤, 붙이고 싶은 곳에 창문과 바퀴를 자유롭게 붙여 멋진 자동차를 완성해 주었어요.\n어제 광목천에 자동차 바퀴 자국 놀이한 곳에 00 이가 만든 자동차를 그 위에 붙이며 뿌듯해했답니다.\n특히 색종이에 창문과 바퀴를 붙였다 떼었다 하며 호기심을 보이기에 자동차 스티커북을 함께 제공해 주었는데요.\n소근육을 조절하며 붙이고 싶은 곳을 자유롭게 붙여보았어요\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 좋음으로 당산공원으로 기분 좋게 산책을 다녀왔어요.\n산책길에 마침 포클레인이 공사하는 멋진 모습을 발견하자, 집중하며 관찰해 보았어요.\n공원에 도착해서 시원하게 미끄럼틀도 타고, 이곳저곳을 자유롭게 탐색하며 활기차고 건강한 하루를 보냈답니다.\n윤이는 미끄럼틀보다는 놀이터 이곳저곳을 뛰어다니며 놀이하는 것을 더 좋아하였어요\n\n다음 주부터 윤이 배변 훈련이 시작되어 윤이에게 이제 로봇 변기에서 쉬를 하며 언니가 되어보자고 이야기를 나누기 시작하였어요\n가정에서도 어린이집 로봇 변기에 긍정적 인식을 가질 수 있도록 이야기 나누어주세요~", "photos": [{"src": "media/1399841277/photo-001.jpg", "thumbnail": "media/1399841277/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1399841277/photo-002.jpg", "thumbnail": "media/1399841277/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1399841277"], "sourceCount": 1}, {"id": "1400520088", "date": "2026-05-29", "className": "채송화반", "content": "윤이는 오늘 오전간식 마들렌과 우유 맛있게 먹고 아침을 시작해 보았어요\n\n오늘은 여러 가지 탈것(경찰차, 포클레인, 택시, 버스) 그림 위에 끼적이기를 해본 뒤 탈것 스티커를 자유롭게 붙여보았어요.\n윤이는 선생님 도움 없이도 스스로 스티커를 붙이며 놀이한 뒤 아쉬워해 자동차 스티커북놀이를 한번 더 해보기도 하였어요\n\n스티커 놀이 뒤에는 벽돌블록에 붙은 트럭 그림을 보고 트럭에 짐을 싣는 놀이도 해보았답니다.\n교실의 여러 가지 블록들을 많이 싣고 싶다고 표현하며 열심히 트럭에 짐을 실어주는 윤이었답니다\n(정리하는 것을 아쉬워할 정도였어요~)\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 보통으로 놀이터에서 모래놀이를 해보았어요.\n모래 위로 자동차를 굴리며 자동차 길을 만들어보고 탐색해 보았어요.\n윤이는 맛있는 아이스크림을 만들어 보여주며 놀이하였답니다\n\n신나게 놀이하고 돌아와 점심시간에 치킨 너겟을 제일 먼저 먹는 친구를 보더니 윤이도 치킨너겟을 먹어보았어요\n끝부분을 조금 베어 먹고 국그릇에 남은 너겟을 넣어 더 먹지 않을 줄 알았는데 생각보다 맛이 나쁘지 않았는지 5개 정도를 같은 방법으로 더 먹어보는 윤이었어요 (폭풍칭찬 해주세요~)\n열무나물은 아삭아삭 소리를 잘 들어볼 수 있도록 양쪽 귀를 막고 씹으면 소리가 크게 들리는 것을 알려주자 나물을 먹을 때마다 귀를 가리고 소리에 집중하며 먹었답니다~ (아마 집에서도 기억하고 할 수도 있을 것 같아요~)\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~\n\n\n*윤이 배변 훈련을 위해 속옷과 여벌 바지 넉넉히 보내주세요~\n물티슈도 다 사용하여 2팩 함께 보내주세요~", "photos": [{"src": "media/1400520088/photo-001.jpg", "thumbnail": "media/1400520088/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1400520088/photo-002.jpg", "thumbnail": "media/1400520088/thumb-photo-002.jpg", "width": 1919, "height": 3410}, {"src": "media/1400520088/photo-003.jpg", "thumbnail": "media/1400520088/thumb-photo-003.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1400520088"], "sourceCount": 1}, {"id": "1401416759", "date": "2026-06-01", "className": "채송화반", "content": "윤이는 오늘 오전간식 오렌지는 한참을 고민하더니 결국은 먹고 싶지 않다고 해 놀이를 시작해 보았어요\n\n오늘은 다양한 동물 그림 위에 끼적이기 놀이를 해보았답니다\n사자, 토끼, 기린 등 여러 가지 동물 그림을 살펴보며 이름을 이야기해 보고, 동물들의 울음소리도 흉내 내며 끼적이기를 해보았지요.\n\n끼적이기 놀이를 하는 중간에는 별꽃반 친구들의 선거 유세도 있었어요\n누가 더 귀여운지, 어떤 동생이 더 마음에 드는지 생각해 보며 이야기 나누었고, 내일은 투표 놀이로 이어서 활동해 보기로 하였답니다.\n동생들이 왔다 간 뒤 채송화반 창문으로 실제 선거 유세를 하는 분들이 지나가 관심을 표현해주기도 하는 윤이었답니다\n\n교실에서 즐겁게 놀이한 뒤에는 놀이터에 나가 바깥놀이도 해보았어요.\n여러 가지 모양 틀을 활용해 모래놀이를 하고, 자동차를 굴리며 놀이하던 중 친구가 지렁이를 발견하여 함께 관찰해 보는 시간도 가졌답니다.\n\n윤이 오늘 오전에 소변 실수 2번 있었어요\n변기에 앉는 것에는 거부감이 없었고 놀이터에 나가기 전에 화장실에 갔을 때에는 '쉬가 나올 거 같아'하고 이야기해 주었는 데 성공하지 못하고 밖에서 실수가 있었어요 (낮잠 시간에는 기저귀 착용하여요 낮잠 들었어요 낮잠 시간 배변훈련은 낮 시간 배변 훈련이 안정적으로 이루어진 뒤 이어서 하겠습니다~)", "photos": [{"src": "media/1401416759/photo-001.jpg", "thumbnail": "media/1401416759/thumb-photo-001.jpg", "width": 1920, "height": 1080}, {"src": "media/1401416759/photo-002.jpg", "thumbnail": "media/1401416759/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1401416759"], "sourceCount": 1}, {"id": "1402107641", "date": "2026-06-02", "className": "채송화반", "content": "윤이는 오늘 오전간식이었던 두부죽 조금 먹고 놀이를 시작해 보았어요\n\n오늘은 ‘제일 귀여운 동생’을 뽑는 선거 날이었어요.\n선거 포스터가 붙어 있는 투표장으로 이동해 후보들을 고루 살펴본 뒤, 가장 마음에 드는 동생을 선택해 스티커를 붙이며 첫 선거 경험을 해보았답니다.\n\n아직은 선거의 의미를 충분히 이해하기에는 어린 나이이지만, 이러한 경험들이 차곡차곡 쌓여 나중에 실제로 투표권을 갖게 되었을 때 소중한 한 표를 현명하게 사용할 수 있는 밑거름이 되리라 기대해 봅니다.\n부모님들께서도 아직 투표를 하지 않으셨다면 내일 꼭 소중한 한 표를 행사하시길 바랍니다.\n아이들과 함께 투표소를 방문해 보는 것도 좋은 경험이 될 것 같아요.\n\n투표 놀이 이후에는 플레이콘을 활용해 사자의 갈기를 표현해 보았어요.\n사자의 몸에 알록달록한 플레이콘을 붙이며 즐겁게 꾸미는 시간을 가졌답니다.\n윤이는 제시해 준 플레이콘을 모두 사용하여 놀이하였답니다\n\n미술놀이를 마친 뒤에는 더워진 날씨로 인해 2층 공동놀이실로 이동하여 놀이를 이어갔어요.\n유모차, 풍선침대, 팡팡볼 등 다양한 놀잇감을 탐색하며 시간 가는 줄 모르고 신나게 놀이했답니다.\n\n*윤이 오늘 소변 2번 변기에 성공하고 한 번만 실수하였어요\n폭풍 칭찬 부탁드려요~ (어린이집에서는 30분 간격으로 화장실에 다녀왔고 변기에 앉았을 때 20초 정도 기다려주면 소변보았습니다)", "photos": [{"src": "media/1402107641/photo-001.jpg", "thumbnail": "media/1402107641/thumb-photo-001.jpg", "width": 1920, "height": 1080}, {"src": "media/1402107641/photo-002.jpg", "thumbnail": "media/1402107641/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1402107641"], "sourceCount": 1}, {"id": "1402858348", "date": "2026-06-04", "className": "채송화반", "content": "윤이는 오늘 오전간식 선식 조금 먹고 놀이를 시작해 보았어요\n\n오늘은 지난 화요일 플레이콘 놀이를 무척 좋아했던 채송화반 친구들과 함께, 오늘은 다가오는 현충일을 맞이하여 플레이콘 태극기 꾸미기를 해보았는데요.\n알록달록한 플레이콘을 조물조물 만지고 꾹꾹 눌러 붙이며, 태극기의 예쁜 색깔과 동그란 모양을 눈과 손으로 자연스럽게 탐색해 보았어요.\n윤이는 선생님이 우리나라의 국화인 무궁화꽃에 대해 이야기해 주자 벽보 속에 어떤 꽃이 무궁화인지 물어보기도 하였답니다\n\n미술놀이 즐겁게 한 뒤에는 어린이집 현관에 걸린 형님들의 태극기 작품을 살펴본 후, 미세먼지가 좋아 당산공원으로 산책을 다녀왔어요.\n산책길에 만난 진짜 태극기가 바람에 살랑살랑 펄럭이자, 발걸음을 멈추고 신기한 듯 한참을 바라보았답니다.\n\n공원 공터에서는 날아다니는 비눗방울을 잡으려 따라가 보기도 하고, 나뭇가지와 돌을 만지며 기어가는 개미를 집중해서 관찰하는 등 오감으로 자연을 느끼며 즐거운 시간을 보냈답니다.\n\n윤이 오늘 점심 김치와 시금치 먹어보았어요 시금치는 새로 제시해 준 책에 염소가 맛있게 먹 는이야기를 듣고 윤이도 먹어볼 거라고 하였는데 오늘 딱 반찬으로 나와 자연스럽게 먹어볼 수 있었답니다~\n\n오늘 소변실수 한 번도 없이 변기에 모두 볼일을 보았어요\n조절 능력이 조금씩 생기고 있는지 오늘은 1시간 정도 간격으로 늘어난 모습이었고 당산 공원에 갈 때 혹시 몰라 기저귀를 하고 나가며 기저귀를 했지만 변기에 하자고 이야기 나누었는데 정말 다녀와서 변기에 소변보는 윤이었답니다~", "photos": [{"src": "media/1402858348/photo-001.jpg", "thumbnail": "media/1402858348/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1402858348/photo-002.jpg", "thumbnail": "media/1402858348/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1402858348"], "sourceCount": 1}, {"id": "1403560312", "date": "2026-06-05", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 고슴도치 퍼즐을 활용해 소근육을 조절하며 움직여보았답니다.\n빨강, 노랑, 파랑 알록달록한 가시의 색깔을 함께 알아보고, 퍼즐을 쏙쏙 끼우는 방법을 안내해 주었더니 모방하며 즐겁게 놀이에 참여했답니다.\n윤이는 놀이 후에 좋아하는 색 가시들을 가득 손에 들고 다니며 놀이해보기도 하였답니다\n\n자유놀이 뒤에는 멍멍, 강아지와 친구들〉 도서를 함께 읽어보았어요.\n책 속에 등장하는 귀여운 동물들의 이름을 불러보고, \"멍멍!\", \"야옹~\" 하며 재미있는 동물 소리도 알아가는 시간을 가졌어요.\n친숙한 동물 소리가 들릴 때마다 집중하며 언어로 표현하는 모습이 보였어요\n\n교실놀이 즐겁게 한 뒤에는 오늘은 미세먼지 '좋음'이라 싱그러운 바람을 느끼며 당산공원으로 산책을 다녀왔어요.\n공원에 도착해서 시원한 바람을 맞으며 미끄럼틀을 신나게 탔어요.\n넓은 공터에서는 조그만 개미와 예쁜 나비를 발견하고 뛰는 모습도 볼 수 있었답니다.\n주변의 다양한 자연물을 직접 만지고 탐색하며 오감을 가득 채운 즐거운 바깥놀이 시간을 보냈답니다.\n윤이 공원에서 달리기를 하다 넘어져 무릎과 팔꿈치를 다쳐 소독 후 연고 발라준 뒤 밴드 붙여주었습니다\n가정에서도 살펴봐주세요\n\n점심은 윤이가 요즘 자주 보는 동화책의 고양이가 잘 먹는 생선이 나온다고 알려주었더니 한입 맛보고는 맛있게 먹었답니다~\n\n윤이 오늘도 소변 실수 없이 변기에 잘해주었어요\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~", "photos": [{"src": "media/1403560312/photo-001.jpg", "thumbnail": "media/1403560312/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1403560312/photo-002.jpg", "thumbnail": "media/1403560312/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1403560312"], "sourceCount": 1}, {"id": "1404379840", "date": "2026-06-08", "className": "채송화반", "content": "윤이는 오늘 오전간식이 사과인 것을 보고는 먹고 싶지 않다고 정확히 표현해 오전간식은 먹지 않고 바로 놀이를 시작해 보았어요\n\n오늘은 동물 숨바꼭질 놀이를 해보았어요.\n숲 속 그림 속에 숨어 있는 여러 가지 동물들을 찾아보며 즐겁게 놀이했답니다.\n처음에는 그림을 자유롭게 살펴보며 동물들을 찾아보고, 이후에는 선생님이 이야기해 주는 동물을 찾아보는 활동도 해보았어요.\n그림 뒤로 살짝 보이는 꼬리나 얼굴을 단서 삼아 동물들을 척척 찾아내주었답니다\n\n동물 찾기 놀이 후에는 엄마 동물과 아기 동물 벽보를 함께 살펴보았어요.\n엄마와 아기의 이름이 같은 동물도 알아보고, 호랑이의 아기인 개호주처럼 조금은 생소한 이름도 들어보며 다양한 동물에 대해 관심을 가져보았답니다. 동물들의 이름을 따라 말해보며 즐겁게 놀이하는 시간을 가졌어요.\n윤이는 동물 놀이 후 자연스럽게 동물 인형들을 데리고 책상에 올려두더니 '이야기를 oto-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1409295520"], "sourceCount": 1}, {"id": "1409989128", "date": "2026-06-18", "className": "채송화반", "content": "윤이는 오늘 오전간식 메뉴를 확인한 뒤 조금 먹어보고는 그만 먹고 싶다고 표현해 정리를 한 뒤 놀이를 시작해 보았어요\n\n오늘은 단오를 맞아 오미자 화채 만들기 놀이를 해보았답니다.\n알록달록한 후르츠 칵테일과 오미자청에 물을 넣고 수저로 저어보며 재료들이 섞이는 과정을 흥미롭게 탐색해 보고 완성된 화채는 새콤달콤한 향과 예쁜 색깔에 탐색해 보며 맛있게 먹어보기도 하였답니다\n화채를 먹으며 단오에는 더워지는 여름을 건강하게 보내기 위해 시원한 음식을 먹고 더위를 이겨냈다는 이야기도 들어보며 우리 전통 명절의 의미도 알아볼 수 있었어요.\n\n단오놀이 뒤에는 공원에서 다양한 새들에 관심을 많이 보여 독수리, 부엉이, 펭귄 등 다양한 새 사진을 살펴보며 생김새와 특징을 알아보는 시간도 가졌답니다. \"이 새는 어디에 살까?\", \"어떻게 날아갈까?\" 이야기 나누며 즐겁게 탐색해 보았어요.\n\n교실 놀이를 마친 뒤에는 놀이터에 나가 동물 모형을 활용한 모래놀이를 해보았어요.\n모래 위에 동물 발자국을 찍어보기도 하고 동물 흉내도 내어보며 놀이해보기도 하였어요.\n\n윤이 오늘 점심 국에 나온 두부가 맛있는지 더 달라고 표현해 여러 개 먹어보았답니다~\n\n*단오 사진은 앨범으로 확인해주세요~", "photos": [], "videos": [], "sourceIds": ["1409989128"], "sourceCount": 1}, {"id": "1410666260", "date": "2026-06-19", "className": "채송화반", "content": "윤이는 오늘 오전간식 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 단오를 맞아 청포잎 주머니를 만들어보았어요.\n옛 선조들은 단옷날 청포를 우린 물로 머리를 감고 몸을 씻으며 건강과 안녕을 기원했다고 해요.\n청포잎의 향과 모양을 살펴보며 정성껏 주머니를 만들어보았답니다.\n오늘 만든 청포잎 주머니는 가정에서도 활용해 보세요.\n함께 손이나 발을 씻어보며 우리나라 전통 명절인 단오의 의미를 자연스럽게 이야기 나누어 보시면 더욱 즐거운 시간이 될 것 같아요.\n\n청포잎 주머니 만들기 뒤에는 다양한 민속놀이도 즐겨보았어요.\n딱지치기와 투호 놀이를 해보았는데, 딱지는 아직 힘 조절과 방향 맞추기가 어려웠지만 여러 번 도전하며 즐거워했답니다.\n투호 놀이는 통 가까이 다가가 화살을 구멍 안에 쏙 넣어보며 성취감을 느껴볼 수 있었어요.\n\n단오를 즐겁게 보낸 뒤에는 롯데마트에도 다녀왔어요.\n마트에 가기 전 공공장소에서 지켜야 할 약속에 대해 이야기를 나누고 출발했는데, 약속을 잘 기억하며 차분한 모습으로 마트를 둘러볼 수 있었답니다.\n수박, 사과, 귤 등 친숙한 과일들을 살펴보고, 커다란 게도 발견하며 신기해했어요.\n또 바나나를 싣고 이동하는 로봇을 보며 눈을 반짝이며 관심을 보이기도 했답니다\n마트에 가기 전부터 기대감 가득했던 윤이 '우리 롯데마트 가는 거야?'를 여러 번 물어보며 즐겁게 다녀와 점심 생선가스도 한입 먹어보았어요\n\n*단오놀이 사진은 앨범으로 확인해 주세요\n*윤이 소변실수가 없어 여벌옷과 속옷 한벌씩만 남겨두고 남은 옷들은 가방에 넣어두었습니다 (남은 기저귀도 함께 넣어두었습니다)", "photos": [], "videos": [], "sourceIds": ["1410666260"], "sourceCount": 1}, {"id": "1411532322", "date": "2026-06-22", "className": "채송화반", "content": "주말 잘 보내셨나요?\n\n윤이는 오늘 오전간식이었던 참외는 입맛에 맞지 않는지 그만 먹고 싶다고 표현해 정리를 하고 놀이를 시작해 보았어요\n\n오늘은 eos": [], "sourceIds": ["1412200831", "1412593139"], "sourceCount": 2}, {"id": "1414899263", "date": "2026-06-27", "className": "채송화반", "content": "선생님 안녕하세요.\n\n오늘 병원 다녀와 알림장 남깁니다.\n\n다행히 구내염은 거의 사라졌고, 수족구 수포가 생겼지만 심하지 않게 지나가는 중이라고 하셨습니다. \n다음 주 화요일에 등원 준비 하고 내원하라 하셔서 확인서 받아 바로 등원할 수 있을 것 같아요.\n\n남은 주말 즐겁게 보내시고, 다음 주에 뵙겠습니다 :)", "photos": [], "videos": [], "sourceIds": ["1414899263"], "sourceCount": 1}, {"id": "1415836821", "date": "2026-06-30", "className": "채송화반", "content": "오랜만에 등원한 윤이는 등원할 때 아버님과의 헤어짐을 조금 아쉬워하였지만 오전 시간을 잘 보냈답니다. 오전 간식 맛있게 먹었고 점심은 샐러드 제외하고 밥 먹었어요.\n\n오늘은 바다 생물 배경 위에 친구들이 직접 꾸민 물고기를 자유롭게 붙여보았어요. 교실 벽면에 붙여주자 자신이 만든 물고기를 알아보고 손짓하며 표현하는 모습이 참 귀여웠어요.\n\n윤이는 헤어밴드를 착용하고 물비누 버튼을 계속 누르는 모습이 보였어요. 윤이에게 \"윤아 버튼을 많이 누르면 거품이 많이 나온대\"라고 이야기해 주니 \"한 번만 해?\"하고 이야기하는 윤이었어요.\n\n미세먼지 좋음으로 놀이터에서는 물고기 목욕놀이를 하며 세숫대야에 물을 담아 물비누를 묻혀 뽀드득뽀드득 깨끗하게 닦아주고 거품을 내어 씻겨주는 과정을 즐겁게 참여했어요. 깨끗한 물로 헹궈주는 모습에서 스스로 놀이를 확장해 가는 창의적인 표현이 돋보였어요.", "photos": [{"src": "media/1415836821/photo-001.jpg", "thumbnail": "media/1415836821/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1415836821/photo-002.jpg", "thumbnail": "media/1415836821/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1415836821"], "sourceCount": 1}, {"id": "1416513488", "date": "2026-07-01", "className": "채송화반", "content": "윤이는 오늘 오전간식 떠먹는 요거트맛있게 먹고 놀이를 해보았어요\n\n오늘은 낚시 놀이를 즐겨하는 채송화반 친구들을 위해 오늘은 파란색 풀장 안에 물고기를 넣어주었어요.\n물고기를 탐색하며 뜰채와 낚싯대로 물고기를 잡아보았어요.\n물고기 잡기 놀이 뒤에는 선생님과 바다생물 썬캐쳐 만들기 놀이를 해보았어요.\n\n윤이는 가오리를 골라서 셀로판지를 붙여보았어요.\n집중하며 두 손으로 셀로판지를 붙여보았고, 완성된 바다생물은 채송화반 창문에 붙여 전시해 보았어요\n윤이가 원하는 위치에 가오리를 붙여주자 '저게 윤이가 한 거야?'하고 확인한 뒤 친구들의 작품도 감상해 보았답니다\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 좋음으로 놀이터로 산책 다녀왔어요.\n새로운 놀이터에서 고래 흔들 말을 타보고, 미끄럼틀을 즐기며 선생님의 도움으로 시소도 타보았답니다.\n다양한 놀이기구에 신나게 놀이하는 윤이었어요\n\n점심은 카레에 살짝 비벼 한 그릇 다 먹고 브로콜리도 조금 먹어본 뒤 푸딩 젤리도 맛있게 먹었어요~\n\n점심 식사 후 대변보았습니다~\n\n*윤이가 양치하며 칫솔모에 잇몸이 찔리는지 아프다고 표현하더라고요\n새 칫솔 보내주시면 교체해 사용하겠습니다~", "photos": [{"src": "media/1416513488/photo-001.jpg", "thumbnail": "media/1416513488/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1416513488/photo-002.jpg", "thumbnail": "media/1416513488/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1416513488"], "sourceCount": 1}, {"id": "1417225481", "date": "2026-07-02", "className": "채송화반", "content": "윤이는 오늘 오전간식 우유는 다 먹고 고구마바는 반정도 먹은 뒤 놀이를 시작해 보았어요\n\n오늘은 상어와 문어를 보며 내가 하고 싶은 바다 생물을 골라 만들기 활동을 했어요.\n윤이는 원하는 문어를 선택하여 선생님의 도움으로 접고 풀칠을 하여 문어를 만들어보았답니다.\n완성된 문어는 들고 다니며 수영하는 흉내도 내보고 선생님과 문어의 꿈 노래도 불러보며 놀이해보기도 하였어요\n선생님 무릎에 문어를 올려놓은 뒤 '여기 앉아있어~'하고는 다른 놀이를 하러 가기도 해 '이러다가 문어가 먹물을 뿜으면 어떻게 하지?'하고 물었더니 윤이가 아직 먹물은 잘 모르는 것 같아 함께 먹물을 뿜는 문어를 찾아보기도 하였답니다.\n신나게 문어와 놀이한 뒤에는 바다 풍경 위에 붙여주었어요.\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 ‘좋음’으로 표시되어 롯데마트까지 산책을 다녀왔어요.\n옥수수, 귤, 참외, 수박을 탐색해 보았고, 구입한 귤은 윤이가 장바구니에 쏙 넣어 가져와주었답니다\n밥 다 먹고 귤 먹기로 해 주었는데 윤이는 껍질을 열심히 까보다가 '너무 말랑말랑해서 못 먹을 것 같아'하고 말하더니 귤은 먹지 않았어요", "photos": [{"src": "media/1417225481/photo-001.jpg", "thumbnail": "media/1417225481/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1417225481/photo-002.jpg", "thumbnail": "media/1417225481/thumb-photo-002.jpg", "width": 1920, "height": 1440}], "videos": [], "sourceIds": ["1417225481"], "sourceCount": 1}, {"id": "1417902007", "date": "2026-07-03", "className": "채송화반", "content": "윤이는 오늘 오전간식이었던 바나나는 먹고 싶지 않다고 표현해 바로 놀이를 시작해 보았어요\n\n오늘은 선생님과 함께 바다생물 단어카드를 보며 맞추기 놀이를 하고, 어항 그림 위에 원하는 바다생물을 자유롭게 붙여보며 표현하는 시간을 가져 보았어요.\n\n꽃게 가방과 토끼 썬캡을제공해 주었더니 윤이는 모자를 쓰고 난 뒤 가방 안에 수수깡과 과일 모형 등 다양한 놀잇감을 넣어보는 활동을 했어요. 처음에는 병 안에 넣었던 수수깡을 신발에도 담아보고 냄비로 옮기기도 하며 여러 가지 방법으로 놀이를 해보는 윤이었답니다\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 ‘좋음’으로 바깥놀이를 하였어요.\n놀이터에서는 꽃게 가방 안에 물통을 넣고 매고 가서 흔들 말과 미끄럼틀을 타며 신체 활동을 충분히 즐겼어요. 놀이 중간에는 물을 마시며 시원한 그늘에서 휴식을 취해보았답니다.\n\n신나게 놀이하고 돌아와 점심 제육볶음 고기도 스스로 먹어보고 쌈장도 콕 찍어 먹어보는 윤이었어요\n고기 먹고 키가 쑥쑥 커서 언니가 될 거 같다는 이야기에 점점 큰 조각의 고기를 먹어보는 윤이었답니다\n칭찬 많이~ 해주세요\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다", "photos": [{"src": "media/1417902007/photo-001.jpg", "thumbnail": "media/1417902007/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1417902007/photo-002.jpg", "thumbnail": "media/1417902007/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1417902007"], "sourceCount": 1}, {"id": "1418767142", "date": "2026-07-06", "className": "채송화반", "content": "주말 잘 보내셨나요?\n윤이는 오늘 오전간식 마시는 요구르트 한 컵 맛있게 먹고 놀이를 시작해 보았어요\n오늘 윤이는 토끼 선캡을 친구들과 함께 쓰고 싶었는지 윤이 한 개 쓰고 난 뒤 친구들을 따라다니며 모자를 씌워주었답니다\n거부하는 친구도 있어 모자를 씌워주기 전에 '해줄까?'하고 친구의 의견을 먼저 물어보고 해 볼 수 있도록 연습을 해보기도 하였어요\n\n자유놀이 즐겁게 한 뒤 오늘은 수수깡을 병에 담고 쏟는 놀이를 즐겨하던 채송화반 친구들의 흥미를 반영하여 주스 가게 놀이를 해보았어요.\n처음에는 손님이 되어 선생님에게 먹고 싶은 주스를 주문하고 맛있게 마셔보는 놀이를 했답니다.\n이후에는 직접 잘게 부순 수수깡을 믹서기 놀잇감에 넣고 갈아 테이크아웃 컵에 담아보며 주스를 만들어 먹는 놀이를 즐겁게 해 보았어요.\n윤이는 빨간 주스병을 보고는 '이건 빨간색이니까 딸기맛'히고 색을 연관 지어 맛을 이야기해 주더라고요 초록색 병은 무슨 맛일지 물어보니 초록 과일은 떠오르지 않는지 '초록색은~'만 이야기해 주고 맛은 답하지 못하는 윤이었어요~\n\n주스 가게 놀이를 마친 뒤에는 더운 여름에 사용하는 물건의 그림자를 보고 알맞은 그림을 찾아보는 놀이를 해보았어요.\n부채, 양산 등 여름철에 자주 사용하는 물건들을 살펴보며 이름과 쓰임을 알아보는 시간을 가졌답니다.\n\n교실놀이 즐겁게 한 뒤에는 비가 내려 실외놀이 대신 교실에서 신나는 음악에 맞춰 춤을 추며 몸을 움직이고 즐거운 시간을 보냈어요.\n\n점심 닭고기 열심히 먹고는 고기 열심히 먹고 키가 커서 배를 타고 싶다고 이야기해 주는 윤이었답니다~\n\n*내일은 오늘의 주스 가게 놀이와 연계하여 포도주스 만들기 놀이를 진행할 예정입니다. 놀이 과정에서 옷이 다소 더러워질 수 있으니, 편안하고 오염되어도 괜찮은 옷을 입고 등원할 수 있도록 해주세요", "photos": [{"src": "media/1418767142/photo-001.jpg", "thumbnail": "media/1418767142/thumb-photo-001.jpg", "width": 1920, "height": 1080}, {"src": "media/1418767142/photo-002.jpg", "thumbnail": "media/1418767142/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1418767142"], "sourceCount": 1}, {"id": "1419461912", "date": "2026-07-07", "className": "채송화반", "content": "윤이는 오늘 오전간식 참외 한입 먹어보더니 맛이 없었는지 그만 먹고 싶다고 표현해 정리를 하고 놀이를 시작해 보았어요\n\n어제 오후 간식 먹은 뒤 주스가게 놀이를 더 하고 싶어 하던 윤이는 오늘 아침에도 맛있는 주스 가게 놀이로 아침을 시작해 보았답니다\n믹서기에 수수깡, 플레이콘을 가득~ 담아 주스를 만들더니 선생님에게는 플레이콘 한 개만 쏙 넣어줘 많이 먹고 싶다고 하니 많이 담은 컵은 윤이가 먹었답니다~\n\n자유놀이 즐겁게 한 뒤에는 어제 맛있는 주스 가게 놀이를 하며 진짜 주스가 없는 것에 아쉬워한 채송화반을 위해 진짜 주스를 만들어보고 먹어보며 놀이를 해보았어요\n\n지퍼백에 담은 포도알을 손으로 잘 눌러 으깨어 껍질 속에서 나오는 초록색 포도 , "date": "2026-07-14", "className": "채송화반", "content": "윤이는 오늘 오전간식 누룽지죽 조금 먹고 난 뒤 놀이를 시작해 보았어요\n\n오늘은 워터펜으로 그림을 그리며 놀이해 보았어요.\n물이 묻으면 숨겨져 있던 알록달록한 그림과 색이 선명하게 나타나는 매트를 보며 눈을 반짝이고 큰 흥미를 보였답니다.\n워터펜을 꼭 쥐고 선을 그어 보기도 하고, 점을 콕콕 찍으며 그림이 하나씩 나타나는 모습을 신기하게 관찰했어요.\n물이 마르면 다시 그림이 사라지는 모습도 살펴보며 물의 특성을 자연스럽게 탐색하는 시간을 가졌답니다.\n윤이는 잠수함 그림을 보고 오리 같다고 표현하며 또 어떤 그림들이 숨어있는지 찾아보며 놀이해 보았어요\n\n물그림 놀이를 마친 뒤에는 소방대피 훈련에 참여했어요.\n불이 났을 때에는 입과 코를 잘 가려야 한다는 이야기를 하며 안전하게 대피 훈련을 해보았답니다.\n\n이후에는 놀이터로 나가 시원한 물놀이를 즐겨보았어요.\n조립하여 만드는 물풍선 장난감과 물레방아, 구멍이 뚫린 바가지 등을 이용해 물을 담고 붓고 흘려보며 다양한 놀이를 경험했답니다.\n물이 바가지를 통과하며 쏟아지는 모습을 관찰하고, 물레방아가 빙글빙글 돌아가는 모습을 보며 즐거워했어요.\n윤이는 옷과 머리에 물이 묻는 것이 싫었는지 조심조심하며 놀이하다 선생님이 물을 뿌려줄 때에는 물을 피해 도망가기도 하였답니다.\n놀이 막바지 즈음에는 바닥에 고인 물 웅덩이를 밟아 보기도 하며 신나게 놀이해 보았어요\n\n점심 콩나물밥 조금 먹고 콩나물이 너무 많아 먹기 힘들다고 해 흰 밥제공해 주었어요", "photos": [{"src": "media/1423071347/photo-001.jpg", "thumbnail": "media/1423071347/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1423071347/photo-002.jpg", "thumbnail": "media/1423071347/thumb-photo-002.jpg", "width": 1919, "height": 2750}], "videos": [], "sourceIds": ["1423071347"], "sourceCount": 1}, {"id": "1423768111", "date": "2026-07-15", "className": "채송화반", "content": "윤이는 오늘 오전간식 시리얼 우유는 다 먹고 시리얼은 반정도만 먹고 놀이를 시작해 보았어요\n\n오늘은 우산 그림 위에 사인펜으로 자유롭게 끼적이기 놀이를 해보았어요.\n먼저 사인펜 뚜껑을 바르게 열고 사용하지 않는 뚜껑은 펜의 뒷부분에 끼우는 방법을 함께 알아본 뒤 나만의 알록달록한 우산을 꾸며보았답니다. 어제 워터펜으로 톡톡 두드리며 놀이했던 경험이 이어져서인지 선을 그리는 것뿐만 아니라 사인펜 끝을 톡톡 눌러 점을 찍으며 다양한 방법으로 표현하는 모습도 볼 수 있었어요. 윤이는 처음에는 우산보다는 주변의 그림에 색을 칠하듯이 놀이하였는데 친구가 '우산에도 해봐~'하는 이야기에 고루고루 끼적이기를 하는 것을 볼 수 있었어요\n\n우산 꾸미기를 마친 뒤에는 선생님이 발견한 아기 사마귀를 함께 관찰해 보았어요.\n아주 작은 몸으로 천천히 움직이는 모습을 신기한 눈빛으로 바라보며 한참 동안 집중하는 모습을 보였답니다.\n지난번 함께 살펴보았던 매미 허물을 기억한 친구가 있어 매미 허물도 함께 놓고 비교하며 관찰해 보았어요.\n사마귀와 매미 허물의 생김새를 살펴보고 크기와 모양의 차이를 이야기하며 곤충에 대한 호기심을 더욱 키워보는 시간이 되었답니다.\n\n이후에는 공동 놀이실로 이동해 신나는 놀이를 이어갔어요.\n형님반이 빌려갔던 미끄럼틀이 다시 돌아와 신나게 미끄럼틀을 타기도 하고 동화책을 보기도 하며 신나게 놀이해 보았어요\n\n점심은 닭개장 국물에 맛있게 먹는 윤이었어요~", "photos": [{"src": "media/1423768111/photo-001.jpg", "thumbnail": "media/1423768111/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1423768111/photo-002.jpg", "thumbnail": "media/1423768111/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1423768111"], "sourceCount": 1}, {"id": "1424495903", "date": "2026-07-16", "className": "채송화반", "content": "윤이는 오늘 짜먹는요거트의작은 젤리 알갱이가 입에 걸리는지 먹고 싶지 않다고 표현해 정리를 하고 놀이를 시작해 보았어요\n\n오늘은 비와 관련된 날씨 스티커를 붙이며 놀이해 보았답니다.\n빗방울, 우산, 먹구름 등 다양한 그림을 살펴보며 \"비가 오면 우산을 써요.\", \"빗방울이 떨어져요.\"라고 이야기 나누고, 비 오는 날의 날씨와 필요한 물건에 대해서도 함께 알아보았답니다.\n윤이는 지난번 천둥번개에 대해 이야기를 나누었던 것이 기억나는지 그 이야기를 다시 해주기도 하였어요\n\n스티커 붙이기 놀이를 마친 뒤에는 어제 즐겁게 했던 사인펜 그림 그리기를 다시 해보았어요.\n선을 길게 그려보기도 하고 동글동글 원을 그려보기도 하며 색이 더해지는 모습을 즐겁게 탐색하는 모습을 보였답니다.\n\n교실 놀이를 마친 뒤에는 놀이터로 나가 싱크대에서 물고기 씻어보는 놀이를 해보았어요.\n졸졸졸 흐르는 물에 물고기를 씻으며 \"뽀득뽀득 깨끗해졌네!\"라고 이야기하기도 하고, 컵에 물을 담아 옮기거나 다시 따라보며 물의 양과 흐름을 자연스럽게 탐색해 보았답니다.\n물을 담고 비우는 과정을 반복하며 집중하는 모습도 볼 수 있었어요.\n\n싱크대 놀이를 마친 뒤에는 영아들이 분무기와 물병을 가져와 나무와 꽃에게도 시원한 물을 주고 싶다고 이야기하여 함께 물을 주어 보았답니다. 나뭇잎에 맺히는 물방울을 관찰해보기도 하였어요.\n물을 활용한 다양한 놀이를 통해 여름의 날씨를 즐겁게 느끼고 자연을 아끼는 마음도 함께 키워보는 하루였답니다.\n\n점심은 콩나물 잡채와 불고기도 조금 먹어보았어요\n\n윤이와 건강하고 즐거운 연휴 보내시고 월요일에 뵙겠습니다~\n\n*7월 20일 월요일은 유원희 교사의 오전반차가 있습니다. 채송화반 보육은 보조교사 선생님께서 함께해 주실 예정이오니 참고해 주세요", "photos": [{"src": "media/1424495903/photo-001.jpg", "thumbnail": "media/1424495903/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1424495903/photo-002.jpg", "thumbnail": "media/1424495903/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1424495903"], "sourceCount": 1}, {"id": "1425406689", "date": "2026-07-20", "className": "채송화반", "content": "주말 잘 보내셨나요?\n\n윤이는 오늘 오전간식은 먹고 싶지 않다고 해 바로 놀이를 시작해 보았어요\n\n오늘은 채송화반에 목욕탕이 문을 열었답니다!\n키위 그림이 있는 목욕 의자에 앉아 목욕 놀이를 시작해 보았어요.\n먼저 눈에 비누가 들어가지 않도록 헤어캡을 써 보고, 샤워볼에 거품을 보글보글 내는 흉내를 내본 뒤 팔, 다리, 배를 문질문질 닦아보았답니다. 몸에 비누칠을 한 뒤에는 바가지로 물을 떠 몸을 헹구며 실제 목욕하는 것처럼 놀이를 즐겼어요.\n내 몸을 깨끗하게 씻은 후에는 친구의 등을 살살 문질러 닦아주며 함께 놀이하는 즐거움도 느껴보았답니다.\n마지막에는 수건으로 몸의 물기를 톡톡 닦아내며 목욕을 마무리해 보았어요.\n놀이를 통해 몸을 깨끗하게 씻는 방법과 순서를 자연스럽게 익힐 수 있었답니다\n\n윤이는 처음 씌워주었던 분홍색 리본 헤어밴드가 마음에 들지 않았는지 복숭아로 바꿔달라고 표현해 잠시 기다렸다가 복숭아로 바꾸어주자 더 활발히 놀이가 이루어졌답니다. 신나게 목욕놀이를 하고 난 뒤에는 수건을 잘 개어 위에 앉아보기도 하였답니다\n\n목욕 놀이를 마친 뒤에는 색종이로 비를 표현하는 미술 놀이를 해보았어요.\n알록달록한 색종이를 손으로 길게 찢으며 손가락 힘을 사용해 보고, 내가 찢은 색종이를 풀로 구름 아래에 하나씩 붙여 시원하게 내리는 빗줄기를 완성해 보았답니다. 색종이의 길이와 모양이 모두 달라 저마다 개성 있는 비 그림이 완성되었어요.\n\n교실 놀이를 즐겁게 마친 뒤에는 비가 내려 실외 놀이 대신 풍선 놀이를 해보았어요.\n처음에는 풍선을 통통 튕기고 바닥에 굴리며 움직임을 따라가 보았고, 이후에는 풍선에 끈을 묶어 발로 차 보며 공놀이처럼 신나게 움직여 보았어요.\n\n점심은 오전간식을 먹지 않아서였는지 밥 두 그릇 든든히 먹고 계란 장조림은 스스로 먹어보았다고 자랑도 해주는 윤이었어요~", "photos": [{"src": "media/1425406689/photo-001.jpg", "thumbnail": "media/1425406689/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1425406689/photo-002.jpg", "thumbnail": "media/1425406689/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1425406689"], "sourceCount": 1}, {"id": "1426081572", "date": "2026-07-21", "className": "채송화반", "content": "윤이는 오늘 오전간식 시금치 된장죽 한입 맛을 보고는 그만 먹고 싶다고 표현해 정리를 하고 놀이를 시작해 보았어요\n\n오늘은 어제에 이어 채송화반 목욕탕에서 목욕 놀이를 진행해 보았어요.\n선생님이 비누통의 펌프를 눌러 샤워볼에 묻혀 몸을 닦고, 샤워기와 세숫대야에 담긴 물을 바가지로 퍼서 씻는 방법을 보여주었더니 모방하며 열심히 놀이에 참여했답니다. 깨끗이 씻은 후에는 수건으로 몸의 물기를 닦아보며 씻는 전체 과정을 즐겁게 경험해 보았어요.\n윤이는 오늘도 어제처럼 바닥에 수건을 깔고 앉아 놀이를 해 이유를 물어보니 옷이 젖어서 그냥 바닥에 앉으면 안 된다고 이야기를 해주더라고요 아마 지난주 물놀이 후 옷을 갈아입기 전 미끄러울까 봐 이불을 깔고 앉았다가 옷을 갈아입었던 경험을 바탕으로 이야기를 해준 것 같아요\n\n목욕 놀이 뒤에는 두 가지 종류의 목욕탕 배경지 중 마음에 드는 것을 직접 골라 사인펜으로 자유롭게 끼적여보고, 소근육을 조절하며 알록달록 스티커를 떼어 붙여 나만의 멋진 배경을 완성해 보았어요. 윤이는 동그라미를 그린 뒤 색을 칠해주기도 하고 길쭉한 타원을 그린 뒤 바나나라고 이야기해주기도 하였답니다\n\n교실놀이 뒤에는 비가 내려 공동놀이실로 이동해 신나는 풍선 놀이를 해보았어요.\n풍선을 높이 날려보기도 하고, 풀장 안에 퐁당 넣으며 신나게 놀았답니다. 또 스스로 미끄럼틀을 씩씩하게 타보고, 선생님의 도움을 받아 안전하고 즐겁게 시소도 타보았어요.\n\n점심은 밥 두 그릇 든든히 먹고 배추나물만 제외하고 반찬들도 골고루 먹어보았어요~\n\n*내일 비가 오지 않을 경우 놀이터에서 거품놀이를 진행하려고 합니다. 젖어도 되는 신발을 착용시켜 등원 부탁드립니다.", "photos": [{"src": "media/1426081572/photo-001.jpg", "thumbnail": "media/1426081572/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1426081572/photo-002.jpg", "thumbnail": " rceIds": ["1429325301"], "sourceCount": 1}, {"id": "1429672414", "date": "2026-07-29", "className": "채송화반", "content": "오전간식과 점심 맛있게 먹었어요. 점심 식사시간에는 밥과 깍두기만 먹었고 마파두부에 있는 두부만 골라 국그릇에 넣는 모습이 보였어요. 오늘먹어보지 못한 음식은 다음에 먹어보자고 이야기 해주었어요\n\n오늘은 목욕탕에서 시원한 바다로 깜짝 변신한 채송화반에서 신나는 물놀이를 즐겼습니다.\n튜브와 보트를 제공해 주니 보트 위에 편안히 누워보기도 하고, 튜브를 탄 채 \"첨벙!\" 소리를 내며 바닷속으로 뛰어드는 모습을 보여주었답니다. 튜브 위에 바다생물 책을 보며 편안하게 누워있었어요. 놀이터에 이어서도 바다생물 책을 챙겨 나가 물에 적셔보았는데요. 물이 닿자 하얀색이었던 바다생물 친구들이 제 색깔을 찾아 변하는 모습을 보며 눈을 반짝였고, 진짜 모습을 함께 알아보며 즐거운 시간을 가졌습니다.\n\n대야에 물을 받아 제공해 주었더니 배를 둥둥 띄워보기도 하고, 배를 뒤집어 물을 담아보고 구멍에서 졸졸 나오는 물줄기를 호기심 가득한 눈으로 탐색했어요. 물줄기를 친구에게 뿌려보기도 하여 물조리개로 물을 뿌려주었더니 손과 몸을 쓱싹쓱싹 깨끗이 씻어내는 귀여운 모습도 보여주었답니다\n나무에 붙어 있는 매미를 잡아 보여주었더니 생김새를 자세히 관찰하고 맴맴 울리는 소리도 가까이서 들어보았어요.\n\n[안내 사항]\n오늘 신나는 물을 이용한 놀이를 진행하여 옷이 젖어 여벌옷으로 갈아입었어요. 내일 **여벌 옷(티셔츠와 바지)**을 챙겨서 보내주시면 감사하겠습니다.\n즐거운 놀이 모습이 담긴 활동 사진은 앨범에서 확인해 주세요!", "photos": [], "videos": [], "sourceIds": ["1429672414"], "sourceCount": 1}, {"id": "1429945815", "date": "2026-07-30", "className": "채송화반", "content": "등원하여 손을 씻으면서 윤이는 \"바나나 안먹을래\"라고 말하여 오전간식은 먹지 않았고 점심 식사시간에는 밥두릇을 먹었답니다. \n\n어제보다 넓어진 바다를 보며 튜브와 보트를 타보았어요. 튜브에 누워보기도 하고 보트에 누워서 편안하게 휴식하는 모습이 보였답니다. 튜브를 하고 텐트에 앉아있는 모습이 보여 튜브는 밖에 놓아두고 텐트에서 휴식해 보자고 이야기해 주었어요. 윤이가 튜브를 왜 빼야 되는지 물어보는 모습이 보여 튜브에 모래가 많아 텐트에 모래가 묻을 수 있다고 이야기해 주었어요. 선생님의 이야기를 듣고 윤이는 튜브를 빼서 바다에 던져 교사가\"풍덩\"하며 말하였더니 윤이도 모방하며 \"풍덩\"하고 말하였답니다.\n\n어제 바깥놀이터에서 배로 놀이하는 모습이 보여, 오늘은 선생님 도움으로 방수 색종이로 종이배 만들기를 해보았어요.\n대야에 바다생물을 넣어주었더니 뜰채로 떠보며 즐겁게 놀이했어요. 빨래 놀이도 해보고, 큰 약병으로 물을 뿌리며 식물에게 시원하게 물을 주었답니다.\n\n[안내사항]\n물을 이용한 놀이를 하여 옷이 젖어 갈아입혔어요. 여벌 옷을 새로 챙겨 보내주세요.\n오늘 활동한 사진은 앨범에서 확인해 주세요.", "photos": [], "videos": [], "sourceIds": ["1429945815"], "sourceCount": 1}, {"id": "1430185217", "date": "2026-07-31", "className": "채송화반", "content": "윤이는 강아지 풀을 들고 등원하였는데요. 옆에 있던 태이가 \"멍멍\"하니 윤이는 \"강아지 풀이야\"하고 말하는 모습이 보였어요\n오전간식과 점심 맛있게 먹었어요.\n\n오늘은 여름 비치가방에 바다생물 스티커를 붙이며 나만의 가방을 꾸며보았어요. 다양한 바다생물 스티커를 자유롭게 붙인 뒤, 내가 담고 싶은 물건을 가방에 넣어 들고 다니며 즐겁게 놀이하였답니다.\n\n미세먼지가 '보통'이어서 1층 놀이터에서 낚시놀이와 시원한 물놀이를 했어요. 뜰채로 물고기를 잡아보고, 다양한 그릇과 바가지, 물조리개를 이용해 물을 담고 부으며 물이 흘러내리는 모습을 탐색하며 즐거운 시간을 보냈습니다.\n\n물놀이를 하며 옷이 젖어 여벌옷으로 갈아입었습니다. 여벌옷을 보내주세요.\n바깥놀이용 모자를 가정으로 보내드리니 주말 동안 세탁하신 후 월요일에 다시 보내주시기 바랍니다.\n사진은 앨범에서 확인해 주세요.", "photos": [], "videos": [], "sourceIds": ["1430185217"], "sourceCount": 1}, {"id": "1430588941", "date": "2026-08-03", "className": "채송화반", "content": "주말 잘 보내셨나요?\n\n윤이는 오늘 오전간식 떠먹는 요거트한 개 맛있게 먹고 놀이를 시작해 보았어요\n\n지난주 수영장 놀이에 대한 흥미가 이어져 오늘은 채송화반에 커다란 바나나보트가 찾아왔답니다.\n놀이를 시작하기 전 선생님과 함께 바나나보트를 안전하게 타는 방법을 알아본 뒤 차례차례 놀이를 즐겨보았어요.\n손잡이를 꼭 잡고 흔들흔들 시소처럼 움직여 보기도 하고, 자리에서 엉덩이를 들썩이며 에어바운서처럼 신나게 몸을 움직여 보기도 했답니다.\n윤이는 바나나보트를 한번 타고난 뒤에는 더 타지 않고 좋아하는 놀잇감을 챙겨 텐트 속에 쏙 들어가 놀이해 보았답니다\n\n바나나보트 놀이를 마친 뒤에는 다가오는 입추 절기에 맞춰 고구마순 껍질 벗기기 놀이도 해보았어요.\n고구마 줄기의 생김새와 촉감을 충분히 탐색한 뒤, 선생님이 끝부분을 살짝 벗겨준 줄기를 잡고 조심조심 껍질을 벗기며 자연물을 탐색하는 시간을 가졌답니다. 윤이는 선생님의 도움이 없이 스스로 껍질 벗기기에 성공하기도 하였어요\n\n실내 놀이를 즐겁게 마친 뒤에는 뜨거운 햇볕을 피해 1층 공동놀이실에서 놀이를 이어갔어요.\n미끄럼틀 놀이와 뽀로로 자동차 놀이 즐기며 즐거운 시간을 보냈답니다.\n\n윤이 낮잠 전 대변이 마려웠는지 뒤척이다가 조금 전 대변보고 지금은 쉬고 있어요~\n\n📢안내드립니다.\n8월 5일(수)에는 원내 물놀이가 예정되어 있습니다.\n물놀이에 필요한 수건(이름을 꼭 적어주세요)을 수요일까지 보내주시기 바랍니다", "photos": [{"src": "media/1430588941/photo-001.jpg", "thumbnail": "media/1430588941/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1430588941/photo-002.jpg", "thumbnail": "media/1430588941/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1430588941"], "sourceCount": 1}, {"id": "1431038002", "date": "2026-08-04", "className": "채송화반", "content": "윤이는 오늘 오전간식 메뉴를 확인하고는 바로 놀이를 시작해 보았어요\n\n오늘은 채송화반이 시원한 계곡으로 물놀이를 떠나 즐거운 놀이를 해보았답니다.\n먼저 계곡에서 만날 수 있는 다양한 생물들을 함께 알아본 뒤, 채집 놀이를 시작했지요.\n작은 양동이를 들고 물속을 살펴보며 물고기도 잡아보고, 다슬기와 가재도 찾아보며 자연 속 생물을 탐색하는 시간을 가졌어요.\n다른 친구들은 물고기를 잡느라 바쁜 모습이었는데 윤이는 다슬기에 관심을 가져주며 돌멩이 밑에 다슬기가 숨어있다는 이야기에 돌을 들춰 다슬기를 찾아보기도 하였어요\n\n열심히 잡은 물고기들은 자연스럽게 지글지글 구워 먹는 캠핑 놀이로 이어졌답니다.\n버너와 랜턴 등 다양한 캠핑용품을 살펴보며 용도와 사용하는 방법을 알아본 뒤 놀이를 즐겨보았어요.\n특히 꼬치에 재료를 하나씩 끼우는 놀이를 무척 좋아하며 집중해서 꼬치를 완성하는 모습을 볼 수 있었답니다.\n\n교실 놀이를 즐겁게 마친 뒤에는 공동 놀이실로 이동해 친구들과 함께 신나게 놀이한 뒤 점심 어묵국에 맛있게 먹고 닭고기도 먹어보았어요\n\n*윤이 낮잠 들었다가 가래가 생겼는지 기침하다 깨서 지금은 쉬고 있어요\n\n📢안내드립니다.\n내일은 원내 물놀이가 예정되어 있습니다.\n수영복(래쉬가드)은입고등원할 수 있도록 해주시고, 방수기저귀와 수건도 함께 보내주세요\n수영복이 없는 경우 옷을 입고 등원하여도 무방하며 아이들의 물건은 바뀔 위험이 있으니 이름을 꼭 적어 보내주세요", "photos": [{"src": "media/1431038002/photo-001.jpg", "thumbnail": "media/1431038002/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1431038002/photo-002.jpg", "thumbnail": "media/1431038002/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1431038002"], "sourceCount": 1}, {"id": "1431470256", "date": "2026-08-05", "className": "채송화반", "content": "오늘은 신나는 원내 물놀이가 있는 날이었어요\n\n물놀이를 하러 나가기 전, 선생님과 함께 물놀이 안전 규칙을 알아본 뒤 1층 현관 앞에 준비된 다양한 놀이부터 시작해 보았답니다.\n알록달록한 물감을 큰 붓에 톡톡 찍어 커다란 캔버스에 마음껏 그림을 그려보고, 색색의 물고기를 뜰채로 잡아보는 놀이도 해보았어요.\n이어서 물총 놀이를 하며 시원한 물줄기를 쏘고 맞아보며 즐거운 시간을 보냈답니다.\n\n무더운 날씨로 인해 현관 앞 놀이는 잠시만 즐긴 뒤, 그늘이 있는 1층 놀이터로 이동해 시원한 아이스크림을 먹으며 더위를 식혀보았어요.\n아이스크림을 먹으며 잠시 휴식을 취한 후에는 본격적으로 물놀이를 시작했답니다.\n\n미스트처럼 뿌려지는 시원한 물줄기를 맞으며 구들과 비치볼을 주고받으며 신나게 놀이해 보았어요. 시원한 물속에서 웃음소리가 끊이지 않을 만큼 즐거운 시간을 보냈답니다.\n\n더운 날씨에 물놀이가 힘들지는 않을까 걱정했지만, 시원한 물과 함께 신나게 놀이하며 더위도 잊고 즐거운 추억을 만들 수 있었던 하루였어요\n윤이는 물속에 몸을 담그는 것보다 다양한 물놀이 놀잇감을 사용해 놀이하는 것을 더 좋아하였어요\n물총, 낚시, 물풍선등 여러 가지 놀잇감을 고루 가지고 놀이하였답니다\n\n윤이 오늘 콩나물밥 한 그릇 잘 먹었어요\n콩나물은 길이가 짧은 것은 먹고 긴 것만 골라내었어요\n부추도 먹어보았으니 칭찬 많이~ 해주세요\n\n*윤이 오늘도 어제처럼 가래가 끼이는지 낮잠 자다가 기침 증상 있었어요\n다행히 가래가 나와 지금은 편안하게 자고 있답니다~\n*오늘 사진은 앨범으로 확인해 주세요~", "photos": [], "videos": [], "sourceIds": ["1431470256"], "sourceCount": 1}, {"id": "1431984135", "date": "2026-08-06", "className": "채송화반", "content": "윤이는 오늘 오전간식 고구마바 맛있게 먹고 우유도 두 컵 든든히 먹고 놀이를 시작해 보았어요\n\n오늘은 계곡에서 잡은 물고기와 다슬기로 맛있는 요리를 만들어 먹는 놀이를 즐기던 채송화반을 위해 오늘은 계곡 생물을 더욱 실감 나게 잡아볼 수 있도록 그물 족대를 준비해 주었어요.\n먼저 족대를 안전하게 사용하는 방법을 알아본 뒤 손잡이를 두 손으로 단단히 잡고 계곡 바닥을 쓸듯이 밀어보며 물고기와 다슬이, 새우 등 다양한 계곡 생물들을 잡아보았답니다.\n윤이는 밀어서 잡는 방법보다는 족대의 막대를 집게처럼 이용해 생물들을 잡아주었답니다\n\n잡은 생물들은 자연스럽게 요리 놀이로 이어져 물고기를 그릴 위에 올려 맛있게 구워 먹어보기도 하고, 커다란 가마솥에 넣어 끓인 뒤 국자로 그릇에 담아 친구들과 함께 나누어 먹는 놀이도 해보았어요. 가마솥에 계곡에서 먹으면 맛있는 백숙을 표현하려 수건으로 만든 닭을 넣어두었는데 윤이는 모자처럼 머리에 쓰고 놀이하기도 하였답니다\n\n교실에서 신나게 놀이를 즐긴 뒤에는 무더운 햇볕을 피해 2층 공동놀이실로 이동해 자유롭게 신체 놀이를 해본 뒤 점심 먹었어요\n윤이 오늘 치킨 너겟이 맛있었는지 더 달라고 표현해 두 번 든든히 먹었어요~\n\n*오전 놀이시간에 대변보았습니다~", "photos": [{"src": "media/1431984135/photo-001.jpg", "thumbnail": "media/1431984135/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1431984135/photo-002.jpg", "thumbnail": "media/1431984135/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1431984135"], "sourceCount": 1}, {"id": "1432530069", "date": "2026-08-07", "className": "채송화반", "content": "윤이는 오늘 오전간식 바나나 두유 맛있게 먹고 놀이를 시작해보았어요\n\n오늘은 어제의 점토 놀이에 다양한 점토 도구를 더해 놀이해보았어요.\n꾹 누르면 와플 모양이 만들어지는 점토 도구도 사용해보고, 여러 가지 모양틀을 꾹꾹 눌러 다양한 모양을 만들어보며 즐겁게 놀이하였답니다. 그중에서도 선생님이 만든 세모 모양 수박이 가장 인기가 있었답니다.\n윤이는 오늘 점토 놀이를 하며 점토의 색에 관심을 보이며 우유와 똑같은 색이라는 이야기를 해주며 놀이해보았답니다\n\n점토 놀이를 마친 뒤에는 계곡에서 빠질 수 없는 백숙 가게도 문을 열었어요. \n쟁반 위에 백숙 냄비를 올려 떨어뜨리지 않도록 조심조심 옮겨보았는데, 아직은 쟁반의 균형을 잡는 것이 어려워 책상까지 안전하게 옮기는 데는 성공하지 못했어요. \n하지만 여러 번 도전하며 신체 균형감각과 집중력을 키워보는 시간이 되었답니다.\n\n교실 놀이를 마친 뒤에는 공동놀이실에서 붕붕카를 타고 신나게 달려보기도 하고, 음악에 맞춰 몸을 흔들며 춤도 추어보았어요. \n다시 교실로 돌아와서는 옥수수 구이를 만들어 먹어보았어요\n\n꼬치에 꽂은 옥수수를 가마솥의 장작불에 가져가 빙글빙글 돌려가며 골고루 구운 뒤 맛있게 먹어보았답니다.\n윤이는 옥수수 한알 맛본 뒤 입맛에 맞지 앉는지 그만 먹고 싶다고 해 정리해주었어요\n\n점심은 평소 먹는양에 3분의 2정도 먹어 오후 간식 든든히 먹을 수 있도록 권유해보겠습니다~\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~", "photos": [{"src": "media/1432530069/photo-001.jpg", "thumbnail": "media/1432530069/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1432530069/photo-002.jpg", "thumbnail": "media/1432530069/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1432530069"], "sourceCount": 1}, {"id": "1433304041", "date": "2026-08-10", "className": "채송화반", "content": "주말 잘 보내셨나요?\n윤이는 오늘 오전간식 메뉴를 확인하고는 먹고 싶지 않다고 표현한 뒤 놀이를 시작해 보았어요\n\n지난주 옥수수 구이 꼬치를 맛있게 먹어보며 놀이하던 중, “수박을 끼우면 수박 꼬치가 될까?”라고 이야기했던 채송화반 친구들의 흥미로운 생각에서 힌트를 얻어 이번 주에는 ‘수박’을 주제로 다양한 놀이를 경험해 보기로 하였답니다.\n\n오늘은 먼저 말랑말랑하고 부드러운 촉감의 수박 말랑이를 손으로 조물조물 만져보며 촉감을 탐색해 보았어요.\n손바닥으로 꾹 눌러보기도 하고 양손으로 잡아당겨보며 말랑이가 변하는 모습을 살펴보는 과정에서 자연스럽게 손가락과 손의 힘을 사용해 보았답니다. 윤이는 말랑이가 재미있었는지 다른 놀이를 하러 가면서도 주머니에 수박 말랑이를 쏙 넣어가지고 다니며 놀이하였답니다\n\n또 동화책 속에서 수박을 나누어 먹는 모습을 함께 살펴본 뒤, “우리도 수박을 나누어 먹어볼까?” 하며 수박 그림을 가위로 싹둑싹둑 잘라 친구들에게 나누어주는 놀이도 해보았어요.\n자른 수박을 친구에게 건네주기도 하고, 맛있게 먹는 흉내를 내며 동화 속 장면을 놀이로 자연스럽게 표현해 보았답니다.\n큰 부분을 잡고 자르면 잘 잘라진다고 알려주자 '이것도 큰데?'하고 말하며 왜 큰 종이를 잘라도 잘 잘라지지 않는지 고민해 보는 윤이었어요\n\n교실에서 즐겁게 놀이한 뒤에는 더위가 조금 누그러져 1층 놀이터로 나가 바깥놀이도 즐겨보았어요.\n커다란 색 분필을 손에 쥐고 바닥에 쓱쓱 선을 그어보며 자유롭게 그림을 표현해 보고, 오랜만에 만난 모래놀이터에서는 모래를 손으로 만져보고 퍼서 담아보며 신나게 놀이해 보았답니다.\n\n바깥놀이 중에는 선생님이 잡아준 매미를 투명한 통에 넣어 친구들과 함께 관찰해보기도 했어요.\n매미의 생김새와 움직임을 가까이에서 살펴보며 “매미다!” 하고 반가워하는 모습도 보였답니다.\n또 주변에서 발견한 송충이도 함께 관찰하며 작은 생명체의 움직임에 관심을 가져보는 시간을 가졌어요.\n\n점심 돈육폭찹 고기도 먹어보며 한 그릇 뚝딱 먹었어요~", "photos": [{"src": "media/1433304041/photo-001.jpg", "thumbnail": "media/1433304041/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1433304041/photo-002.jpg", "thumbnail": "media/1433304041/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1433304041"], "sourceCount": 1}, {"id": "1433976275", "date": "2026-08-11", "className": "채송화반", "content": "윤이는 오늘 오전간식이 죽이라는 것을 알고 있었는지 '나 죽 안 먹을 거야'하고 말한 뒤 놀이를 시작해 보았어요\n\n오늘은 더위가 심해지기 전 시원한 오전 시간에 먼저 실외 놀이를 다녀왔어요.\n놀이터의 모래에 물을 조금씩 섞어 촉촉해진 모래의 변화를 손으로 느껴보고, 틀에 모래를 꾹꾹 눌러 담아 맛있는 케이크를 만들어보았답니다. 모래를 담고 뒤집어 모양이 나타나자 “케이크 완성!” 하고 기뻐하며 친구들과 함께 생일 놀이를 하거나 케이크를 나누어 주는 흉내를 내며 즐겁게 놀이해 보았어요. 윤이는 포도 케이크를 만들어 선생님에게 나눠주기도 하였답니\n\n케이크 만들기 놀이를 한 뒤에는 어제 즐겁게 경험했던 분필 그림 놀이도 이어서 해보았답니다.\n바닥에 동그라미와 선을 그려보기도 하고, 친구가 그린 그림을 함께 살펴보며 이야기를 나누어보았어요.\n또 주변에서 들려오는 매미 소리에 귀 기울이며 매미를 찾아보기도 하였지요.\n오늘은 매미들이 모두 높은 나무 위에 있어 직접 잡아보지는 못했지만, “맴맴” 울리는 소리를 들으며 여름 곤충에 대한 관심을 이어가며 놀이해 보았답니다.\n\n실외 놀이를 즐겁게 마치고 돌아오는 길에는 텃밭에서 쑥쑥 자란 수박을 수확해 보았어요\n수박을 손으로 통통 두드려 소리를 들어보고, 가까이에서 냄새도 맡아보며 오감을 활용해 탐색해 보았답니다.\n수박은 냉장고에 넣어두었다가 내일 시원하게 맛보기로 하였어요.\n\n교실에 돌아와서는 곧 다가오는 말복에 대해 이야기 나누며 더운 여름날 건강하게 지내기 위한 음식에는 어떤 것들이 있는지 알아보았답니다. 닭, 인삼, 대추 등의 모형 재료를 넣어 삼계탕 만들기 놀이를 해보며 : "media/1435935220/photo-001.jpg", "thumbnail": "media/1435935220/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1435935220/photo-002.jpg", "thumbnail": "media/1435935220/thumb-photo-002.jpg", "width": 1920, "height": 1080}], "videos": [], "sourceIds": ["1435935220"], "sourceCount": 1}, {"id": "1436823427", "date": "2026-08-18", "className": "채송화반", "content": "주말 잘 보내고 오셨나요?\n윤이는 오늘 오전간식 바나나 조금 먹고 난 뒤 놀이를 시작해 보았어요\n\n금요일에 ‘수박 공 던져라’ 놀이를 하며 수박씨에 관심을 보였던 모습을 반영하여 오늘은 ‘수박씨 만들기’ 놀이를 해보았어요.\n면봉에 검은색 물감을 묻혀 수박에 콕콕 찍어 씨를 표현해 보았고, 교사의 모습을 따라 하며 수박씨를 하나씩 만들어 보았어요.\n이후 「수박 수영장」 그림책을 보며 “석석석”, “쏙”, “휙”, 등의 재미있는 표현을 따라 말하며 그림책을 즐겨보았어요.\n\n미술놀이 뒤에는 요리놀이로 음식 모형을 꼬치에 하나씩 꽂아 냄비와 식판에 담아보았어요.\n완성된 꼬치 음식을 맛있게 먹는 흉내를 내며 즐겁게 역할놀이를 이어갔답니다.\n\n교실놀이 즐겁게 한 뒤에는 미세먼지 농도가 ‘좋음’이어서 롯데마트로 바깥활동을 다녀왔어요.\n마트에서 수박, 파인애플, 키위, 포도 등 다양한 과일을 살펴보며 모양과 색을 탐색해 보았어요.\n점심 식사 후에는 마트에서 구입한 포도도 맛있게 먹으며 즐거운 하루를 보냈답니다.\n윤이는 샤인머스캣 알이 커서 먹기 힘들 것 같다고 걱정하더니 잘라주자 맛있게 먹었답니다", "photos": [{"src": "media/1436823427/photo-001.jpg", "thumbnail": "media/1436823427/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1436823427/photo-002.jpg", "thumbnail": "media/1436823427/thumb-photo-002.jpg", "width": 1920, "height": 1440}], "videos": [], "sourceIds": ["1436823427"], "sourceCount": 1}, {"id": "1437538278", "date": "2026-08-19", "className": "채송화반", "content": "윤이는 오늘 오전간식이었던 마시는 요거트가맛있었는지 2컵 먹고 놀이를 시작해 보았어요\n\n오늘은 여름철 대표 과일인 수박을 주제로 다양한 놀이를 즐겨보았답니다.\n먼저 2조각과 4조각 수박 퍼즐 중 원하는 퍼즐을 골라 천천히 맞추며 수박의 모양을 살펴보았어요.\n퍼즐 놀이 즐겁게 한 뒤에는 과일 심기 놀이에도 관심이 생겼는지 제시해 준 과일 밭 4개 중 3개를 포개어 들고 와 열심히 과일을 심어 보는 윤이었어요\n\n과일 심기 놀이 뒤에는 풀장에는 빨간색 비닐과 수박공놀이도 해보았답니다.\n풀장 안에 들어가 비닐을 만지며 미끌미끌한 촉감을 느껴보고, 수박공을 던져보며 신나게 놀이했어요.\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 ‘좋음’이어서 어린이집 주변을 산책하고 놀이터에도 다녀왔어요.\n미끄럼틀과 시소를 타며 몸을 움직이고, 시원한 바람을 느끼며 산책하던 중 “맴맴맴” 들려오는 매미 소리에 귀 기울이며 매미를 찾아보기도 했어요. 여름을 느낄 수 있는 다양한 놀이와 바깥활동을 즐겁게 경험한 하루였어요.\n\n점심은 짜장에 비벼달라고 해 비벼주었는데 오늘 유니 짜장이어서 작게 갈린 고기가 불편했는지 반정도 먹고 군만두는 맛있는지 더 달라고 해 두 번 먹었어요 (만두 안에 있는 고기는 괜찮았나 봐요~)", "photos": [{"src": "media/1437538278/photo-001.jpg", "thumbnail": "media/1437538278/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1437538278/photo-002.jpg", "thumbnail": "media/1437538278/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1437538278"], "sourceCount": 1}, {"id": "1438195698", "date": "2026-08-20", "className": "채송화반", "content": "윤이는 오늘 오전간식 치즈 맛있게 먹고 놀이를 시작해보았어요\n간식을 먹는 윤이에게 어제 병원에 다녀왔는지 물어보았더니 병원 불이 꺼져있어서 병원에가지 못했다는 이야기를 해주기도 하였답니다\n\n간식을 먹은 뒤 어제 수박수영장에서 빨간색 비닐을 만지며 미끌미끌한 촉감에 관심을 보였던 모습을 반영하여, 오늘은 지퍼백 안에 수박과 잘라진 수박 그림을 넣고 빨간색 물감과 초록색 모래를 함께 담아 제공해 주었어요. \n손으로 지퍼백을 문지르며 수박 그림을 살펴보고 물감과 모래가 움직이는 모습도 탐색해 보았어요.\n윤이는 특히 모래가 들어간 것에 더 흥미를 보이며 주머리를 요리 조리 기울여 놀이해보았어요\n\n수박놀이 뒤에는 어제 아파트 놀이터에서 들었던 공사 소리에 궁금해하는 모습을 보여 오늘은 공구놀이와 망치놀이를 준비해 주었어요. \n망치로 모양못을 두드리며 못이 내려가는 모습을 살펴보고, 잘 내려가지 않을 때는 손으로 꾹 눌러보며 다양한 방법으로 놀이해 보았어요.\n\n교실놀이 뒤에는 비가 조금씩 내려 공동놀이실에서 대체활동을 진행했어요. \n수술 터널을 지나가고 수박공을 굴려 볼링핀을 넘어뜨리며 몸을 움직여 보았어요. \n수술 놀이 하며 윤이는 수술 뒤로 얼굴을 가리는 놀이를 하고 싶어하였는데 통과 놀이를 하고 싶은 친구들이 밀려와 빈 수술을 찾아 요리조리 자리를 옮겨가며 놀이하였답니다\n수술놀이 뒤에는 오랜만에 선생님과 손을 잡고 계단을 오르내리며 안전하게 신체활동도 경험해 보았어요\n\n점심 식사 전 대변 시원하게 보고 점심 밥 닭고기도 스스로 먹어보며 '윤이는 쑥쑥 커야해서 고기 먹을꺼야'하고 말하며 점심도 잘 먹었는데 오늘은 잠이 오지 않는지 쉬고있어요\n\n*윤이 오전 놀이시간에는 기침 없었고 이부자리에 누웠을 때만 기침 조금 있었습니다", "photos": [{"src": "media/1438195698/photo-001.jpg", "thumbnail": "media/1438195698/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1438195698/photo-002.jpg", "thumbnail": "media/1438195698/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1438195698"], "sourceCount": 1}, {"id": "1438872672", "date": "2026-08-21", "className": "채송화반", "content": "윤이는 오늘 오전간식 닭죽 조금 먹고 놀이를 시작해 보았어요\n\n오늘은 수박 그림 위에 수박씨 스티커를 자유롭게 붙여보았답니다.\n선생님이 바닥의 수박에 어떤 것이 없는지 물어보자 처음에는 대답을 못하다가 '검은색 뭐가 없지?'하고 힌트를 주니 씨가 없다는 것을 알아차리고는 맘스보드에 붙어 있는 수박씨를 하나씩 가져와 수박 그림 위에 올려보며 놀이하고, 수박의 모양과 색을 살펴보았어요. 빨간색 수박도 먹어볼 수 있도록 주었는데 윤이는 씨가 있어 싫다고 표현하며 수박은 한입 먹고 더 먹지 않았어요\n\n교실놀이 즐겁게 한 뒤에는 비가 내려 실내에서 대체활동을 진행했어요.\n다양한 색의 풍선에 수박 줄무늬와 수박씨를 표현해 주고, 긴 초록색 풍선을 제공해 주었더니 손으로 치며 즐겁게 놀이했어요.\n에어컨 바람을 따라 움직이는 풍선을 따라가며 쳐보기도 하고, 풍선을 동그랗게 연결해 나만의 공간을 만들어 그 안에 들어가 보며 다양한 방법으로 풍선을 탐색했답니다.\n윤이는 수박 공으로 농구 놀이를 했던 것을 기억하고 풍선으로 농구 놀이도 해보았답니다\n\n점심은 계란찜에 맛있게 먹는 윤이었어요~\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다~", "photos": [{"src": "media/1438872672/photo-001.jpg", "thumbnail": "media/1438872672/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1438872672/photo-002.jpg", "thumbnail": "media/1438872672/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1438872672"], "sourceCount": 1}, {"id": "1439620296", "date": "2026-08-24", "className": "채송화반", "content": "선생님, 안녕하세요.\n\n윤이가 토요일부터 고열 증상이 있어요😭\n새벽에 해열제를 먹고 지금은 잠잠해진 상태이지만, 불안한 마음에 오늘은 가정보육을 하며 지켜보려고 합니다.\n\n일정에 참고 부탁드려요!\n내일 뵙겠습니다 :)", "photos": [], "videos": [], "sourceIds": ["1439620296"], "sourceCount": 1}, {"id": "1441846471", "date": "2026-08-27", "className": "채송화반", "content": "윤이는 오늘 오전간식 오곡 시리얼 맛있게 먹고 놀이를 시작해 보았어요\n\n지난 며칠 윤이가 등원하지 못하는 동안 교실에 새롭게 생긴 놀잇감을 탐색하느라 바쁜 아침을 보낸 윤이었답니다\n자유놀이 즐겁게 한 뒤에는 어제 친구들이 작두콩을 직접 뽑아보았던 경험을 이어 놀이해 보기 위해 과일 텃밭 놀이를 해보았어요.\n텃밭에 수박, 바나나, 복숭아, 포도 등 다양한 과일을 심어보고 쏙쏙 뽑아보며 과일의 모양과 색을 살펴보았답니다.\n나무에 붙어 있는 과일도 하나씩 떼어 붙여보며 과일의 겉과 속을 자연스럽게 탐색해 보았어요.\n윤이는 그중 바나나를 골라 들더니 구워서 뜨겁다는 표현을 하며 호호 불어먹기도 하였답니다\n\n교실놀이 즐겁게 한 뒤에는 미세먼지가 ‘좋음’이어서 놀이터에서 색깔 얼음놀이도 즐겨보았어요.\n전지 위에 내가 좋아하는 얼음 물감으로 끼적이고 콕콕 찍어보았으며, 흰 쟁반에 얼음을 문질러보기도 했어요.\n바닥에도 전지를 넓게 펼쳐주자 자유롭게 끼적이며 놀이하고, 종이컵에 담긴 물감을 쏟아보는 등 다양한 방법으로 색과 얼음의 변화를 경험해 보았답니다. 윤이는 물감이 옷에 묻을까 걱정이 되었는지 종이컵을 들고 이동하며 조심조심 그림을 그려주었답니다\n\n신나게 그림 그리고 돌아와 점심 닭고기에 맛있게 먹고 김말이 강정도 조금 먹어보았어요\n\n*오늘 활동 사진은 앨범에서 확인해 주세요.\n*상반기 부모만족도조사서를 보내드립니다. 작성하신 후 8월 31일 월요일까지 어린이집으로 보내주시기 바랍니다.", "photos": [], "videos": [], "sourceIds": ["1441846471"], "sourceCount": 1}, {"id": "1442506762", "date": "2026-08-28", "className": "채송화반", "content": "윤이는 오늘 오전간식 사과는 먹고 싶지 않다고 표현해 바로 놀이를 시작해 보았어요\n\n오늘은 어제 놀이터에서 얼음 물감으로 끼적였던 종이를 교실 벽면과 바닥에 붙여 새로운 공간에서 놀이를 이어가 보았답니다.\n과일 스티커와 색연필을 자유롭게 선택해 끼적이고, 스티커를 하나씩 떼어보며 “수박”, “바나나” 등 과일 이름을 말해보기도 했답니다.\n라벨지로 만든 스티커여서 떼기 어려워하는 친구들은 선생님 도움을 받아 놀이를 해보았는데 윤이는 가운데 가위집을 낸 부분을 활용해 스스로 스티커 떼기에 성공해 놀이를 해보았답니다. 스티커를 열심히 붙인 뒤에는 스티커 위를 빨간색으로 칠하더니 '사과로 변하는 거야'하고 이야기해주기도 하였답니다\n스티커 놀이 즐겁게 한 뒤에는 벽면에 붙어 있는 어제 놀이 사진을 보며 내 사진과 친구들의 모습을 살펴보고 반가운 친구의 얼굴을 찾아보기도 했어요.\n\n미술놀이 뒤에는 과일 모양의 징검다리를 건너보고, 과일의 속과 씨를 표현한 촉감판도 탐색해 보았어요.\n제자리에서 폴짝폴짝 뛰어보며 발로 누르며 움직이는 씨를 관찰해 보았답니다\n\n교실놀이 즐겁게 한 뒤에는 무더운 날씨로 인해 공동놀이실에서 대체활동을 진행했어요.\n윤이는 미끄럼틀 조금 타고는 책 보기에 집중하는 모습이었어요\n\n점심은 돼지고기에 맛있게 먹었답니다\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다\n*윤이 오늘 점심 식사 후 소변 실수 있어 여벌 옷으로 갈아입었습니다", "photos": [{"src": "media/1442506762/photo-001.jpg", "thumbnail": "media/1442506762/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1442506762/photo-002.jpg", "thumbnail": "media/1442506762/thumb-photo-002.jpg", "width": 1920, "height": 2560}], "videos": [], "sourceIds": ["1442506762"], "sourceCount": 1}, {"id": "1443418126", "date": "2026-08-31", "className": "채송화반", "content": "주말 잘 보내셨나요?\n윤이는 오전간식 요구르트 맛있게 먹고 놀이를 시작해 보았어요\n\n지난주 여러 가지 과일을 탐색하며 놀이하던 채송화반 친구들은 과일의 모양과 색에 관심을 보이며 자연스럽게 색의 이름을 알아보는 경험으로 놀이를 확장해 보았답니다.\n이러한 관심을 반영하여 9월에는 ‘색과 모양’을 주제로 다양한 놀이를 경험해 볼 예정입니다.\n\n오늘은 알록달록한 무지개 하트 보석을 가지고 색깔을 탐색해 보았어요.\n먼저 여러 가지 색의 보석을 살펴보며 색의 차이를 알아보고, 여러 색의 접시 중 하나를 선택하여 같은 색의 보석을 찾아 담아보며 색깔별로 분류해 보았답니다.\n같은 색을 찾아 하나씩 모아보는 과정에서 자연스럽게 색을 비교하고 구분해 보는 경험을 해볼 수 있었어요.\n윤이는 열심히 색을 나누어 분류를 해보다가 노란색을 찾아보던 도중 주황빛이 도는 보석은 어떤 색인지 정확히 판단하기가 어려웠는지 '이것도 노란색이야?'하고 물어보며 색을 확인해주기도 하였답니다.\n분류 놀이를 마친 뒤에는 보석을 통에 옮겨 담아보기도 하고, 냄비에 보석을 가득 담아 요리하는 모습으로 놀이를 확장하며 즐겁게 탐색해 보았어요.\n\n교실놀이를 즐긴 뒤에는 비가 내려 실외놀이 대신 교실에서 알록달록한 볼풀공 놀이를 해보았어요.\n놀이를 시작하기 전 볼풀공을 밟으면 미끄러질 수 있음을 알아보고, 공을 밟지 않고 안전하게 놀이하기로 약속한 뒤 놀이를 시작했답니다.\n볼풀공을 데굴데굴 굴려보기도 하고 두 손으로 힘껏 던져보기도 하며 공의 움직임을 다양하게 경험해 보았어요.\n선생님이 장바구니에 공을 가득 담아 위에서 비처럼 쏟아주자 떨어지는 공을 따라가며 즐겁게 탐색하기도 하였답니다.\n이후에는 장바구니에 직접 공을 담아보며 공을 모으고 옮기는 놀이를 즐기고, 가득 모은 공을 다시 뿌려보며 신나게 놀이를 이어가 보았어요.\n\n점심은 계란장조림에 맛있게 한 그릇 뚝딱 먹은 윤이에요~", "photos": [{"src": "media/1443418126/photo-001.jpg", "thumbnail": "media/1443418126/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1443418126/photo-002.jpg", "thumbnail": "media/1443418126/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1443418126"], "sourceCount": 1}, {"id": "1444132868", "date": "2026-09-01", "className": "채송화반", "content": "윤이는 오늘 오전간식 고구마바와 우유 맛있게 먹고 놀이를 시작해 보았어요\n\n오늘은 스크래치 종이에 끼적이기 놀이를 해보았답니다.\n까만 종이에 막대로 자유롭게 끼적여보니 숨겨져 있던 알록달록 다양한 색이 나타나자 “어?” 하며 신기해하는 모습을 보였답니다.\n막대를 손에 쥐고 힘을 조절해 선을 그어보기도 하고, 여러 방향으로 자유롭게 움직이며 나만의 멋진 그림을 만들어보았어요.\n\n끼적이기 놀이 후에는 색컵을 이용한 곰돌이 색 분류 놀이도 해보았답니다.\n어제 알록달록 보석을 이용해 색을 구분해 보았던 경험이 이어져서인지 오늘은 선생님의 도움 없이도 곰돌이의 색을 살펴본 뒤 같은 색의 컵을 찾아 쏙쏙 넣어보았어요.\n곰돌이를 하나씩 집어 컵에 넣으며 색을 비교하고 분류해 보는 즐거운 시간을 가져보았답니다.\n\n교실놀이를 즐겁게 한 뒤에는 비가 내려 교실에서 볼풀공 놀이를 한번 더 해보았어요.\n알록달록 색깔 통을 살펴본 뒤 통과 같은 색의 공을 찾아 쏙 넣어보며 공이 통 안으로 굴러 떨어지는 것을 탐색해 보았답니다.\n공을 하나씩 찾아 넣어보기도 하고 여러 개의 공을 들고 와 한꺼번에 넣어보며 즐겁게 놀이했어요.\n윤이는 빨간색이 마음에 들었는지 빨간색 공만 쏙쏙 골라 통 안에 넣으며 놀이해 보았지요\n이후에는 공동놀이실로 동화책 열심히 본 뒤 점심 온두부에 맛있게 먹는 윤이었어요\n\n*내일은 노란색을 주제로 놀이해보려 합니다.\n노란색 옷이나 소품 등 노란색과 관련된 것이 있다면 착용하고 등원할 수 있도록 해주세요.\n(필수는 아니며, 노란색 관련 옷이나 소품이 없다면 연한 색 계열의 옷을 입고 등원해도 좋습니다.)", "photos": [{"src": "media/1444132868/photo-001.jpg", "thumbnail": "media/1444132868/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1444132868/photo-002.jpg", "thumbnail": "media/1444132868/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1444132868"], "sourceCount": 1}, {"id": "1444848145", "date": "2026-09-02", "className": "채송화반", "content": "윤이는 오늘 오전간식 맛있게 먹고 난 뒤 놀이를 시작해 보았어요\n\n오늘은 색깔을 주제로 놀이하며 채송화반 친구들이 많은 관심을 보여주었던 노란색을 주제로 ‘옐로우데이’ 놀이를 즐겨보았어요.\n\n먼저 노란색의 대표적인 과일인 레몬과 바나나를 탐색해 보았답니다.\n바나나와 레몬의 색깔과 모양을 살펴보고 과일을 직접 만져보며 촉감을 느껴보았어요.\n껍질에서 나는 향기도 맡아보며 달콤한 바나나 향과 새콤한 레몬 향을 비교해 보고, 레몬은 조금씩 맛보며 새콤한 맛도 경험해 보았답니다.\n오감을 활용해 노란색 과일을 탐색해 보는 시간이었어요.\n\n과일 탐색을 마친 뒤에는 노란색 점토를 활용한 미술놀이를 해보았어요.\n점토를 손으로 조물조물 만지고 길쭉하게 밀어 바나나 모양을 만들어보기도 하고, 동그랗게 뭉치거나 여러 모양으로 변형해 보며 자유롭게 표현해 보았답니다.\n선생님이 만든 소프트콘 모양의 점토를 살펴보며 자신만의 다양한 형태로 다시 만들어보는 등 노란 점토의 부드러운 촉감을 느끼며 놀이를 이어갔어요.\n\n탐색놀이와 미술놀이 후에는 교실 가득 노란 풍선을 펼쳐 신나는 신체놀이도 즐겨보았어요.\n노란 풍선으로 가득한 풀장에 들어가 데굴데굴 몸을 굴려보기도 하고, 풍선을 발로 차거나 두 손으로 힘껏 던져보며 온몸을 활발하게 움직여보았답니다.\n노란 수술을 높이 들어 올렸다가 비처럼 사르르 떨어뜨려보며 친구들과 함께 색다른 신체놀이도 경험해 보았어요.\n\n옐로우데이 놀이를 신나게 즐긴 후에는 오랜만에 비가 오지 않아 놀이터에서 바깥놀이도 다녀왔어요.\n시원한 바깥공기를 느끼며 놀이터를 자유롭게 오가고 신나게 뛰어놀며 즐거운 시간을 보냈답니다.\n교실로 돌아와 점심을 맛있게 먹은 뒤에는 간식으로 준비된 노란 바나나 빵도 함께 맛보며 오늘의 노란색 놀이를 즐겁게 마무리해 보았어요.\n(윤이 바나나빵 먹을 생각에 볶음밥에 있는 야채와 베이컨 모두 남기지 않고 다 먹었답니다~)\n\n*오늘의 즐거운 놀이 모습은 앨범에서 확인해 주세요.\n*윤이 오늘 장화를 신고와 발목 부근이 장화에 쓸려 불편해해 반창고 붙이고 놀이하기는 하였는데 괜찮은지 가정에서도 살펴봐주세요", "photos": [], "videos": [], "sourceIds": ["1444848145"], "sourceCount": 1}, {"id": "1445569332", "date": "2026-09-03", "className": "채송화반", "content": "윤이는 오늘 오전간식 맛있게 먹은 뒤 놀이를 시작해 보았어요\n\n오늘은 어제 재미있게 가지고 놀았던 노란 풍선을 커다란 지퍼백에 가득 담아 폭신폭신한 ‘풍선 침대’를 만들어 놀이해 보았어요\n풍선 침대 위에 조심스럽게 누워 휴식을 취해보기도 하고, 소파처럼 앉아 엉덩이로 콩콩 뛰어보며 풍선의 말랑말랑하고 흔들리는 느낌을 몸으로 경험해보기도 하였어요. 콩콩 뛰며 풍선이 뻥 터져도 재미있는지 웃음이 끊이지 않았답니다\n윤이는 한번 올라가서 앉아보고 누워보며 놀이해 보다가 생각만큼 편안하지 않았는지 금방 일어나 다른 놀이를 하는 모습이었어요\n\n풍선 놀이를 신나게 즐긴 뒤에는 알록달록 여러 가지 색의 색종이를 가지고 놀이해 보았어요.\n색종이를 살펴보며 “무슨 색일까?” 함께 이야기 나누어보고, 네모난 색종이를 돌돌 말아 눈에 대어보며 망원경으로 변신시켜보기도 하였답니다. 색종이를 반으로 접어 네모 접기를 해보며 종이의 모양이 달라지는 과정도 경험해 보고, 선생님이 접어준 동서남북, 하트 등 다양한 모양을 살펴보기도 하였어요.\n직접 종이를 접고 구기고 말아 보며 색과 모양의 변화에 관심을 가지고 자유롭게 탐색해 보는 시간이었답니다.\n윤이는 처음에는 네모 접기를 해보다가 색종이로 모자, 가면처럼 머리 위에 올리고 써보기도 하였답니다\n\n교실에서 즐거운 놀이를 충분히 경험한 뒤에는 놀이터로 나가 커다란 색 분필로 그림을 그려보았어요.\n여러 가지 색의 분필을 살펴보고 원하는 색을 골라 바닥에 자유롭게 끼적여보며 분필이 지나간 자리에 알록달록한 선과 그림이 나타나는 모습을 관찰해 보았답니다.\n\n신나게 놀이하고 와서인지 점심이 맛있었는지 윤이 고기와 김치 골고루 먹고 밥도 두 그릇 먹고 더 달라고 표현하더라고요\n더 먹으면 탈이 날 수 있을 것 같아 오후 간식 많이 먹기로 하였답니다~", "photos": [{"src": "media/1445569332/photo-001.jpg", "thumbnail": "media/1445569332/thumb-photo-001.jpg", "width": 1920, "height": 2560}, {"src": "media/1445569332/photo-002.jpg", "thumbnail": "media/1445569332/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1445569332"], "sourceCount": 1}, {"id": "1446267956", "date": "2026-09-04", "className": "채송화반", "content": "윤이는 오늘 오전간식 반그릇 정도 먹은 뒤 놀이를 시작해 보았어요\n\n알록달록 색깔 물감이 떨어지는 스틱을 컵에 넣어 주스라고 표현하며 놀이를 시작하는 윤이었답니다\n\n자유놀이 즐겁게 한 뒤 오늘은 어제 재미있게 놀이하였던 색종이 놀이를 다시 한번 경험해 본 뒤, 알록달록한 도화지에 끼적이기를 해보았어요.\n먼저 여러 가지 색의 사인펜을 살펴보며 내가 좋아하는 색을 골라보고, 자유롭게 선을 그어보며 끼적이기를 즐겨보았답니다.\n종이 위에 사인펜으로 선을 그어보는 과정에서 서로 다른 색이 만나 새로운 느낌의 색과 무늬가 나타나는 것을 살펴보며 색의 변화에도 자연스럽게 관심을 가져보았어요.\n반복해서 끼적이며 손의 움직임을 조절해 보고, 자신이 표현하고 싶은 것을 자유롭게 나타내보는 시간도 가졌답니다.\n\n끼적이기 놀이를 마친 뒤에는 야광봉 놀이를 해보았어요.\n야광봉 스틱을 똑똑 구부리자 반짝반짝 빛이 나타나는 모습을 신기하게 바라보며 빛의 변화를 탐색해 보았답니다.\n고리 연결 부분을 이용해 여러 개의 야광봉을 이어 동그란 모양을 만들어 팔찌처럼 착용해보기도 하고, 손목에 차보며 친구들과 서로의 야광봉을 살펴보기도 했어요. 윤이는 선생님이 만든 집에 쏙 들어가 놀이를 하더니 동그란 팔찌를 안경이라고 표현하며 얼굴에 대어보기도 하였답니다\n\n놀이가 이어지면서 야광봉은 더욱 다양한 놀이 도구로 변신했답니다.\n스틱을 길게 연결해 집을 만들어보기도 하고, 낚싯대처럼 움직여보기도 하며 내가 생각한 방법으로 자유롭게 놀이를 확장해 보았어요.\n정해진 방법 없이 나의 생각과 상상에 따라 새로운 형태로 만들어가는 과정에서 창의적인 표현과 놀이의 즐거움을 충분히 경험할 수 있었답니다.\n\n야광봉 놀이를 마친 후 실외 놀이를 나가려 하였지만, 야광봉 놀이에 대한 흥미가 계속해서 이어지는 친구들이 많아 교실에서 야광봉 놀이를 충분히 즐긴 뒤 2층 공동놀이실에서 신체 놀이를 해보았어요.\n넓은 공간에서 몸을 자유롭게 움직이며 뛰고 걷고 움직여보며 즐겁게 신체 활동을 경험해 보았답니다\n\n신나게 놀이하고 점심 오늘도 밥 두 그릇 든든히 먹는 윤이었어요~ (엄마에게 잘 먹었다고 꼭 이야기해 달라고 했답니다~)\n\n윤이와 건강하고 즐거운 주말 보내시고 월요일에 뵙겠습니다", "photos": [{"src": "media/1446267956/photo-001.jpg", "thumbnail": "media/1446267956/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1446267956/photo-002.jpg", "thumbnail": "media/1446267956/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1446267956"], "sourceCount": 1}, {"id": "1447170430", "date": "2026-09-07", "className": "채송화반", "content": "주말 잘 보내셨나요?\n윤이는 오늘 오전간식인 멜론을 확인하더니 먹고 싶지 않다고 표현해 바로 놀이를 시작해 보았어요\n\n오늘은 지난주 야광봉을 동그랗게 연결하며 즐겁게 놀이했던 채송화반의 관심을 반영하여, 동그란 모양의 양말목을 활용한 놀이를 해보았어요.\n\n먼저 알록달록 다양한 색깔의 양말목을 하나씩 살펴보며 색과 모양을 자유롭게 탐색해 보았답니다.\n양말목을 그릇에 차곡차곡 담아보기도 하고, 손목과 발목에 끼워보며 새로운 방법으로 놀이해보기도 하였어요.\n양말목을 잡아당기자 쭉 늘어나는 모습에 관심을 보이며 늘어난 양말목을 컵에 걸어보기도 하고, 여러 개를 연결하여 길게 만들어보기도 했답니다.\n양말목의 탄성을 충분히 경험한 뒤에는 선생님과 양쪽에서 잡아당겨보며 재미있는 줄다리기 놀이도 즐겨보았어요.\n선생님과 줄다리기 놀이 뒤에는 발가락에 걸어 늘려보는 놀이를 해보았답니다\n\n양말목 놀이를 충분히 즐긴 후에는 지난주에 재미있게 놀이했던 야광봉 놀이도 다시 이어가 보았답니다.\n오늘은 지난주보다 더욱 다양한 색깔의 야광봉과 모양을 만들 수 있는 도구가 추가되어, 여러 가지 방법으로 야광봉을 연결하고 구부려보며 다양한 모양을 만들어보았어요.\n익숙하게 동그란 모양을 만들어보기도 하고 새로운 도구를 활용해 모양을 변화시켜 보며 즐겁게 탐색해 보았답니다.\n\n교실에서 다양한 놀이를 즐긴 뒤에는 놀이터로 나가 바깥놀이도 해보았어요.\n커다란 분필을 손에 쥐고 바닥에 자유롭게 선과 그림을 그려보며 끼적이기를 즐겨보고, 친구들과 함께 미끄럼틀을 타며 신나게 움직여보았답니다.\n\n신나게 놀이한 뒤 점심 계란찜에 한 그릇 맛있게 먹고 대변도 시원하게 보았어요", "photos": [{"src": "media/1447170430/photo-001.jpg", "thumbnail": "media/1447170430/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1447170430/photo-002.jpg", "thumbnail": "media/1447170430/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1447170430"], "sourceCount": 1}, {"id": "1447866655", "date": "2026-09-08", "className": "채송화반", "content": "윤이는 오늘 오전간식은 먹고 싶지 않다고 해 바로 놀이를 시작해 보았어요\n\n오늘은 어제 양말목을 팔찌처럼 손목에 끼워 놀이했던 경험을 이어 작은 밴드로 나만의 팔찌를 만들어보는 놀이를 해보았어요.\n\n알록달록 다양한 색의 밴드를 살펴본 뒤, 선생님이 만들어준 팔찌에 반짝반짝 빛나는 여러 모양의 지비츠 중 마음에 드는 모양을 골라 끼워보며 나만의 팔찌를 완성해 보았답니다.\n작은 밴드는 손가락에 쏙 끼워 예쁜 반지로 만들어보기도 하며 다양한 방법으로 놀이를 즐겨보았어요.\n윤이는 처음에는 동물 모양 지비츠를 골라 끼웠다가 나중에 구름 모양을 발견하고는 구름으로 바꿔 달라고 표현하였답니다\n완성된 팔찌는 오늘 하루 윤이 팔목에 함께 하였지요\n\n양말목 놀이를 마친 뒤에는 알록달록 여러 가지 색의 의자 놀잇감을 가지고 놀이해 보았어요.\n연두색, 하늘색 등 새로운 색의 이름을 알아보고 같은 색의 의자를 모아 보기도 하였답니다.\n의자를 차곡차곡 쌓아 올리며 무너지지 않도록 조심조심 집중하는 모습도 볼 수 있었어요.\n윤이는 처음에는 잘 되지 않자 선생님 도움을 요청하였는데 집중하면 할 수 있다는 응원에 몇 번 시도 후 성공하더니 정말 환한 웃음을 보여주었어요\n\n교실 놀이를 즐겁게 한 뒤에는 선선해진 가을 날씨를 느끼러 당산공원에 다녀왔어요.\n어느새 울음소리가 들리지 않는 매미를 찾아보며 궁금한 마음을 표현하기도 하고, 나무에 매달린 매미 껍질과 바닥에 떨어진 모과를 살펴보며 가을의 자연을 느껴보았답니다.\n\n신나게 놀이하고 돌아와서인지 점심밥도 두 그릇 든든히 먹었답니다\n*내일은 물감을 활용한 놀이를 해보려 합니다. 물감이 묻어도 괜찮은 옷을 입고 등원할 수 있도록 해주세요", "photos": [{"src": "media/1447866655/photo-001.jpg", "thumbnail": "media/1447866655/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1447866655/photo-002.jpg", "thumbnail": "media/1447866655/thumb-photo-002.jpg", "width": 1920, "height": 1080}], "videos": [], "sourceIds": ["1447866655"], "sourceCount": 1}, {"id": "1448563826", "date": "2026-09-09", "className": "채송화반", "content": "윤이는 오늘 오전간식 선식 조금 먹고 난 뒤 놀이를 시작해 보았어요\n\n오늘은 알록달록 다양한 색깔의 색연필을 살펴보며 같은 색깔의 물건을 찾아 분류해 보는 놀이를 해보았어요.\n먼저 빨강, 노랑, 초록, 파랑 등 여러 가지 색의 색연필을 하나씩 살펴보며 색깔을 탐색해 보고, 색연필과 같은 색으로 만들어진 다양한 물건 그림을 찾아보았답니다.\n여러 그림 중 원하는 색깔을 골라 같은 색끼리 모아보며 즐겁게 분류해 보았어요.\n분류 놀이를 마친 뒤에는 색연필 그림을 떼어 바닥에 그림을 그리는 흉내를 내보기도 하였답니다\n윤이는 간식을 먹으며 희서가 놀이하는 모습을 유심히 살펴보더니 그림 자석들을 열심히 모아 냄비에 담아 놀이해보기도 하였답니다\n\n색깔 분류 놀이 후에는 평소 색의 혼합과 관련된 동화책에 관심을 보였던 모습을 반영하여 물감 혼합 놀이를 해보았어요.\n동화책에서 보았던 빨강, 주황, 노랑, 초록, 파란색 물감을 살펴본 뒤 마음에 드는 색 한 가지를 골라 코인티슈에 톡톡 떨어뜨려 보았답니다.\n코인티슈에 물감이 스며드는 모습을 관찰해 보고, 그 위에 또 다른 색의 물감을 떨어뜨려 두 색이 만나면 어떻게 달라지는지 탐색해 보았어요.\n“어떤 색이 되었을까?” 하고 함께 살펴보며 색이 조금씩 변하는 모습을 눈으로 확인하고, 여러 색을 자유롭게 섞어보며 알록달록한 색의 변화를 즐겨보았답니다.\n\n물감 놀이를 즐겁게 마친 뒤에는 놀이터로 나가 오랜만에 모래놀이도 해보고, 살랑살랑 날아다니는 비눗방울을 따라가며 신나게 놀이해 보았어요.\n\n신나게 놀이한 뒤 점심 하이라이스 소스에 비벼 한 그릇 맛있게 먹었어요", "photos": [{"src": "media/1448563826/photo-001.jpg", "thumbnail": "media/1448563826/thumb-photo-001.jpg", "width": 1919, "height": 3410}, {"src": "media/1448563826/photo-002.jpg", "thumbnail": "media/1448563826/thumb-photo-002.jpg", "width": 1919, "height": 3410}], "videos": [], "sourceIds": ["1448563826"], "sourceCount": 1}, {"id": "1449262045", "date": "2026-09-10", "className": "채송화반", "content": "윤이는 오늘 오전간식 맛있게 먹은 뒤 알록달록 팔찌들을 탐색해 보며 아침을 시작해 보았어요\n자유놀이 즐겁게 한 뒤 오늘은 무늬가 없는 얼룩말과 젖소 그림에 김을 이용해 검은색 무늬를 표현해 보는 놀이를 해보았어요.\n\n먼저 바삭바삭한 김을 손으로 만져보며 촉감을 느껴보고, 고소한 김의 향과 검은색 색깔을 살펴보았답니다.\n김을 손가락으로 조금씩 찢어보며 크기와 모양을 자유롭게 만들어본 뒤, 아스테이지 비닐이 덮인 얼룩말과 젖소 그림 위에 김을 붙여 무늬를 꾸며보았어요.\n물이 없는 곳에서는 김이 잘 붙지 않지만, 분무기로 물을 뿌린 곳에는 김이 ‘척!’ 하고 달라붙는 모습을 발견하며 물의 양에 따라 김이 붙는 모습이 달라지는 것도 흥미롭게 탐색해 보았답니다.\n\n특히 동글동글하게 뭉친 김에 물을 뿌려보자 김이 물을 머금으며 점점 부풀어 오르는 모습을 관찰하기도 했어요.\n물을 머금으며 달라진 김의 모습을 살펴보고, 직접 물을 뿌려보며 반복해서 변화를 경험해 보았답니다.\n\n김 놀이를 마친 뒤에는 커다란 도화지에 알록달록한 스티커를 붙여보기도 하고, 다양한 색의 그리기 도구로 자유롭게 끼적이며 그림을 표현해 보았어요.\n넓은 종이 위를 자유롭게 움직이며 선과 모양을 그려보고, 친구들과 함께 그림을 완성해 보며 즐겁게 놀이한 뒤에는 놀이터에도 다녀왔답니다.\n\n놀이터에서는 선선해진 가을바람을 온몸으로 느껴보며 놀이해 보았어요.\n바닥에
